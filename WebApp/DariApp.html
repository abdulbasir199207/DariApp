<div id="app">
  <div class="screen" id="screen"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div id="modalRoot"></div>
<div id="dialogRoot"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   DariApp – Web-Version (PWA). Vollständig offline, lokal.
   Portiert Kernlogik der nativen App: FSRS, Antwortprüfung,
   Scheduler, Statistik. Daten in localStorage; Audio in IndexedDB.
   ============================================================ */

/* ---------- Persistenz ---------- */
const DB = {
  KEY:'dariapp.v1',
  data:{cards:[], logs:[], settings:null},
  load(){
    try{ const raw=localStorage.getItem(this.KEY); if(raw) this.data=JSON.parse(raw); }catch(e){}
    if(!this.data.cards) this.data.cards=[];
    if(!this.data.logs) this.data.logs=[];
    if(!this.data.settings) this.data.settings={appearance:'light',defaultMode:'flip',defaultDirection:'mixed',dailyGoal:20,animations:true};
  },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){ toast('Speichern fehlgeschlagen (Speicher voll?)'); } }
};

/* ---------- Audio (IndexedDB für Blobs) ---------- */
const AudioStore = {
  _db:null,
  open(){ return new Promise((res)=>{ if(this._db) return res(this._db);
    const r=indexedDB.open('dariapp-audio',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('audio'); };
    r.onsuccess=()=>{ this._db=r.result; res(this._db); };
    r.onerror=()=>res(null);
  });},
  async put(id,blob){ const db=await this.open(); if(!db)return; return new Promise(r=>{const t=db.transaction('audio','readwrite');t.objectStore('audio').put(blob,id);t.oncomplete=()=>r();t.onerror=()=>r();});},
  async get(id){ const db=await this.open(); if(!db)return null; return new Promise(r=>{const t=db.transaction('audio','readonly');const q=t.objectStore('audio').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});},
  async del(id){ const db=await this.open(); if(!db)return; return new Promise(r=>{const t=db.transaction('audio','readwrite');t.objectStore('audio').delete(id);t.oncomplete=()=>r();t.onerror=()=>r();});}
};

/* ---------- Hilfen ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const DAY=86400000;
function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- FSRS 4.5 ---------- */
const FSRS={
  w:[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.0310,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.5870,0.2272,2.8755],
  retention:0.90, maxInterval:365, decay:-0.5, factor:19/81,
  R(t,S){ if(S<=0)return 0; return Math.pow(1+this.factor*t/S,this.decay); },
  initD(g){ return clamp(this.w[4]-Math.exp(this.w[5]*(g-1))+1,1,10); },
  initS(g){ return Math.max(this.w[g-1],0.1); },
  nextD(d,g){ const delta=-this.w[6]*(g-3); const damped=d+delta*(10-d)/9; const mr=this.w[7]*this.initD(4)+(1-this.w[7])*damped; return clamp(mr,1,10); },
  recallS(d,s,r,g){ const hard=(g===2)?this.w[15]:1; const easy=(g===4)?this.w[16]:1;
    const f=Math.exp(this.w[8])*(11-d)*Math.pow(s,-this.w[9])*(Math.exp(this.w[10]*(1-r))-1)*hard*easy; return s*(1+f); },
  forgetS(d,s,r){ return this.w[11]*Math.pow(d,-this.w[12])*(Math.pow(s+1,this.w[13])-1)*Math.exp(this.w[14]*(1-r)); },
  interval(S){ const raw=S/this.factor*(Math.pow(this.retention,1/this.decay)-1); return clamp(Math.round(raw),1,this.maxInterval); },
  /* state: 'new'|'learning'|'review'|'relearning'; g: 1..4 */
  schedule(card,g,reviewDate){
    const elapsed = card.lastReview ? Math.max((reviewDate-card.lastReview)/DAY,0) : 0;
    let nd,ns,nstate;
    if(card.state==='new'||!card.state){
      nd=this.initD(g); ns=this.initS(g); nstate=(g===1)?'learning':'review';
    } else {
      const r=this.R(elapsed,card.s||0); nd=this.nextD(card.d||5,g);
      if(g===1){ ns=this.forgetS(nd,card.s||0.1,r); nstate='relearning'; }
      else { ns=this.recallS(nd,card.s||0.1,r,g); nstate='review'; }
    }
    ns=Math.max(ns,0.1);
    const iv=this.interval(ns);
    return {s:ns,d:clamp(nd,1,10),state:nstate,interval:iv,due:reviewDate+iv*DAY};
  }
};

/* ---------- Antwortprüfung ---------- */
const Answer={
  persianMap:{'ي':'ی','ك':'ک','ۀ':'ه','ة':'ه','أ':'ا','إ':'ا','آ':'ا','ؤ':'و'},
  strip:['ً','ٌ','ٍ','َ','ُ','ِ','ّ','ْ','ٰ','‌','‍','﻿'],
  normalize(t,fa){
    let s=(t||'').trim().toLowerCase();
    s=s.split(/\s+/).filter(Boolean).join(' ');
    if(fa){ s=[...s].map(c=>this.persianMap[c]||c).filter(c=>!this.strip.includes(c)).join(''); }
    return s;
  },
  lev(a,b){ a=[...a];b=[...b]; if(!a.length)return b.length; if(!b.length)return a.length;
    let prev=Array.from({length:b.length+1},(_,i)=>i), cur=new Array(b.length+1);
    for(let i=1;i<=a.length;i++){ cur[0]=i;
      for(let j=1;j<=b.length;j++){ const cost=a[i-1]===b[j-1]?0:1; cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost); }
      [prev,cur]=[cur,prev];
    } return prev[b.length];
  },
  evaluate(input,solutions,fa){
    const ni=this.normalize(input,fa); if(!ni) return 'wrong';
    const sols=solutions.map(s=>this.normalize(s,fa)).filter(Boolean);
    if(sols.includes(ni)) return 'perfect';
    for(const s of sols){ const d=this.lev(ni,s); const tol=s.length>=4?1:0; if(d<=tol&&d>0) return 'typo'; }
    return 'wrong';
  }
};
function ratingFromQuality(q,fast){ if(q==='perfect')return fast?4:3; if(q==='typo')return 2; return 1; }

/* ---------- Scheduler (Durchmischung + Tag-Interleaving) ---------- */
function buildQueue(cards,limit){
  const active=cards.filter(c=>c.active);
  const due=active.filter(c=>isDue(c));
  const pool=due.length?due:active;
  const scored=pool.map(c=>{
    let overdue=c.nextReview?Math.max((now()-c.nextReview)/DAY,0):2.0;
    const diff=(clamp(c.d||5,1,10)-1)/9;
    return {c,p:overdue*2+diff*1.5+Math.random()};
  }).sort((a,b)=>b.p-a.p).map(x=>x.c);
  // Interleave nach erstem Tag
  const res=[]; const rem=scored.slice();
  while(rem.length){
    const last=res.length?(res[res.length-1].tags[0]||null):null;
    let i=rem.findIndex(c=>(c.tags[0]||null)!==last);
    if(i<0)i=0; res.push(rem.splice(i,1)[0]);
  }
  return limit?res.slice(0,limit):res;
}
function isDue(c){ if(!c.active)return false; if(!c.nextReview)return true; return c.nextReview<=now(); }

/* ---------- Statistik ---------- */
function computeStats(){
  const cards=DB.data.cards, logs=DB.data.logs;
  const total=cards.length, active=cards.filter(c=>c.active).length;
  const startToday=new Date(); startToday.setHours(0,0,0,0);
  const today=logs.filter(l=>l.date>=startToday.getTime()).length;
  let rate=0,avg=0;
  if(logs.length){ rate=logs.filter(l=>l.rating!==1).length/logs.length; avg=logs.reduce((a,l)=>a+l.time,0)/logs.length; }
  // streak
  const days=new Set(logs.map(l=>{const d=new Date(l.date);d.setHours(0,0,0,0);return d.getTime();}));
  let streak=0; let day=new Date(); day.setHours(0,0,0,0); let dt=day.getTime();
  if(!days.has(dt)){ dt-=DAY; if(!days.has(dt)) dt=null; }
  while(dt!==null&&days.has(dt)){ streak++; dt-=DAY; }
  // hardest
  const hardest=cards.filter(c=>c.reps>0).sort((a,b)=>b.d-a.d).slice(0,5);
  // tags
  const tc={}; cards.forEach(c=>c.tags.forEach(t=>tc[t]=(tc[t]||0)+1));
  const topTags=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  // per day 14
  const perDay=[]; const base=new Date(); base.setHours(0,0,0,0);
  for(let off=13;off>=0;off--){ const d0=base.getTime()-off*DAY; const d1=d0+DAY; perDay.push(logs.filter(l=>l.date>=d0&&l.date<d1).length); }
  return {total,active,inactive:total-active,today,rate,avg,streak,hardest,topTags,perDay};
}

/* ---------- Tags ---------- */
function allTags(){ const s=new Set(); DB.data.cards.forEach(c=>c.tags.forEach(t=>s.add(t))); return [...s].sort((a,b)=>a.localeCompare(b)); }

/* ============================================================
   UI
   ============================================================ */
const App={ tab:'learn', session:null };

function applyTheme(){
  const a=DB.data.settings.appearance;
  const root=document.documentElement;
  let theme=a;
  if(a==='system'){ theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
  root.setAttribute('data-theme',theme);
  if(DB.data.settings.animations===false) root.setAttribute('data-noanim',''); else root.removeAttribute('data-noanim');
  document.querySelector('meta[name=theme-color]').setAttribute('content', theme==='dark'?'#0F151B':'#F7F3EC');
}

const ICONS={
  learn:'<svg viewBox="0 0 24 24"><path d="M12 3C8 3 5 6 5 10c0 2 1 3 1 5v3h12v-3c0-2 1-3 1-5 0-4-3-7-7-7z"/></svg>',
  cards:'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v9"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>'
};
function renderTabs(){
  const t=document.getElementById('tabbar');
  const items=[['learn','Lernen'],['cards','Karten'],['stats','Statistik'],['settings','Mehr']];
  t.innerHTML=items.map(([k,l])=>`<button class="tab ${App.tab===k?'active':''}" onclick="go('${k}')">${ICONS[k]}<span>${l}</span></button>`).join('');
}
window.go=function(tab){ App.tab=tab; App.session=null; render(); };

function render(){
  renderTabs();
  const s=document.getElementById('screen');
  s.className='screen fadein';
  if(App.session){ s.innerHTML=viewSession(); afterSession(); return; }
  if(App.tab==='learn') s.innerHTML=viewLearn();
  else if(App.tab==='cards'){ s.innerHTML=viewCards(); }
  else if(App.tab==='stats') s.innerHTML=viewStats();
  else s.innerHTML=viewSettings();
}

/* ---------- Lernen (Konfiguration) ---------- */
const LearnCfg={mode:null,direction:null,tags:new Set()};
function viewLearn(){
  const st=DB.data.settings;
  if(LearnCfg.mode===null)LearnCfg.mode=st.defaultMode;
  if(LearnCfg.direction===null)LearnCfg.direction=st.defaultDirection;
  const cands=candidates();
  const dueN=DB.data.cards.filter(isDue).length;
  const modes=[['flip','Umdrehen','◫'],['mc','Multiple Choice','☰'],['write','Schreiben','✎']];
  const tags=allTags();
  return `
  <div class="nav-title">Lernen</div>
  <div class="muted small" style="margin:-8px 2px 0">${dueN} fällige Karten heute</div>
  <label class="lbl">Modus</label>
  ${modes.map(([k,l,i])=>`<button class="card row" style="width:100%;text-align:left;${LearnCfg.mode===k?'background:var(--accent);color:#fff':''}" onclick="setMode('${k}')">
     <span><span style="margin-right:10px">${i}</span>${l}</span>${LearnCfg.mode===k?'<span>✓</span>':''}</button>`).join('')}
  <label class="lbl">Richtung</label>
  <div class="seg">
    ${[['g2p','DE → FA'],['p2g','FA → DE'],['mixed','Gemischt']].map(([k,l])=>`<button class="${LearnCfg.direction===k?'on':''}" onclick="setDir('${k}')">${l}</button>`).join('')}
  </div>
  <label class="lbl">Tags</label>
  ${tags.length? `<div style="display:flex;flex-wrap:wrap;gap:8px">
     <button class="chip ${LearnCfg.tags.size===0?'on':''}" onclick="toggleLearnTag(null)">Alle</button>

/* ---------- Session ---------- */
window.startSession=function(){
  const queue=buildQueue(candidates(),DB.data.settings.dailyGoal);
  if(!queue.length){toast('Keine Karten verfügbar');return;}
  App.session={queue,index:0,mode:LearnCfg.mode,direction:LearnCfg.direction,
    flipped:false,revealed:false,answered:0,correct:0,qStart:now(),
    choices:null,selected:null,lastQuality:null,dir:null,writeVal:''};
  prepareCurrent();
  render();
};
function curCard(){return App.session.queue[App.session.index];}
function prepareCurrent(){
  const S=App.session; S.flipped=false;S.revealed=false;S.selected=null;S.lastQuality=null;S.writeVal='';
  S.dir = S.direction==='mixed' ? (Math.random()<.5?'g2p':'p2g') : S.direction;
  if(S.mode==='mc') buildChoices();
  S.qStart=now();
}
function answerIsPersian(){return App.session.dir==='g2p';}
function promptText(){const c=curCard();return App.session.dir==='g2p'?(c.de[0]||''):(c.fa[0]||'');}
function answerText(){const c=curCard();return App.session.dir==='g2p'?(c.fa[0]||''):(c.de[0]||'');}
function promptIsPersian(){return App.session.dir==='p2g';}

function buildChoices(){
  const c=curCard(); const faSide=answerIsPersian();
  const correct=faSide?(c.fa[0]||''):(c.de[0]||'');
  const others=DB.data.cards.filter(o=>o.id!==c.id);
  const tagSet=new Set(c.tags);
  const ans=o=>faSide?(o.fa[0]||''):(o.de[0]||'');
  const sameTag=others.filter(o=>o.tags.some(t=>tagSet.has(t)));
  const rest=others.filter(o=>!o.tags.some(t=>tagSet.has(t)));
  const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const pool=shuffle(sameTag).concat(shuffle(rest)).map(ans).filter(v=>v&&v!==correct);
  const distract=[]; for(const v of pool){ if(distract.length>=3)break; if(!distract.includes(v))distract.push(v); }
  let opts=[correct,...distract]; opts=[...new Set(opts)]; if(!opts.includes(correct))opts.push(correct);
  opts=shuffle(opts);
  App.session.choices=opts; App.session.correctIdx=opts.indexOf(correct);
}

function applyRating(g){
  const S=App.session, c=curCard(), t=(now()-S.qStart)/1000;
  const r=FSRS.schedule({state:c.state,s:c.s,d:c.d,lastReview:c.lastReview},g,now());
  c.s=r.s;c.d=r.d;c.state=r.state;c.interval=r.interval;c.lastReview=now();c.nextReview=r.due;c.lastTime=t;c.reps=(c.reps||0)+1;
  if(g===1){c.wrong=(c.wrong||0)+1; if(c.state==='relearning')c.lapses=(c.lapses||0)+1;}
  else {c.correct=(c.correct||0)+1; S.correct++;}
  DB.data.logs.push({date:now(),rating:g,time:t,mode:S.mode,cardId:c.id});
  S.answered++;
  DB.save();
}
function advance(){ const S=App.session; S.index++; if(S.index>=S.queue.length){S.done=true;} else prepareCurrent(); render(); }

window.doFlip=()=>{App.session.flipped=!App.session.flipped;App.session.revealed=true;buzz(10);render();};
window.doRate=g=>{buzz(10);applyRating(g);advance();};
window.doChoice=i=>{ const S=App.session; if(S.selected!==null)return; S.selected=i;
  const q=(i===S.correctIdx)?'perfect':'wrong'; S.lastQuality=q; buzz(q==='perfect'?[10]:[40,30,40]);
  applyRating(ratingFromQuality(q,(now()-S.qStart)/1000<4)); render(); };
window.doWrite=()=>{ const S=App.session; const el=document.getElementById('writeInput'); const val=(el?el.value:S.writeVal).trim();
  if(!val)return; S.writeVal=val;
  const c=curCard(); const sols=answerIsPersian()?c.fa:c.de;
  const q=Answer.evaluate(val,sols,answerIsPersian()); S.lastQuality=q; S.flipped=true;
  buzz(q==='perfect'?[10]:q==='typo'?[30]:[40,30,40]);
  applyRating(ratingFromQuality(q,(now()-S.qStart)/1000<5)); render(); };
window.sessionNext=()=>advance();

function viewSession(){
  const S=App.session;
  if(S.done){
    const rate=S.answered?Math.round(S.correct/S.answered*100):0;
    return `<div class="empty fadein" style="padding-top:80px">
      <div class="big" style="color:var(--sage)">✓</div>
      <div style="font-size:22px;font-weight:700;color:var(--text)">Session abgeschlossen</div>
      <div style="margin:10px 0 24px">${S.answered} Karten · ${S.correct} richtig · ${rate}%</div>
      <button class="pillbtn" style="max-width:220px;margin:0 auto" onclick="go('learn')">Fertig</button>
    </div>`;
  }
  const prog=S.index/S.queue.length*100;
  let body='';
  if(S.mode==='flip') body=viewFlip();
  else if(S.mode==='mc') body=viewMC();
  else body=viewWrite();
  return `<div class="row" style="margin-bottom:8px"><button class="chip" onclick="go('learn')">✕ Beenden</button><span class="muted small">${S.index+1} / ${S.queue.length}</span></div>
    <div class="progress"><div style="width:${prog}%"></div></div>${body}`;
}

  el.onkeydown=e=>{if(e.key==='Enter')doWrite();}; } }

function viewFlip(){
  const S=App.session, c=curCard();
  const front=!S.flipped;
  const audioBtn=(!front&&c.audio)?`<button class="audiobtn" onclick="event.stopPropagation();playAudio('${c.id}')">◉</button>`:'';
  const faceInner=front
    ? `<div class="term-big ${promptIsPersian()?'fa persian':''}">${esc(promptText())||'—'}</div>

    : `<div class="term-big ${answerIsPersian()?'fa persian':''}">${esc(answerText())||'—'}</div>

}
function viewMC(){
  const S=App.session;
  const opts=S.choices.map((o,i)=>{

function viewWrite(){

let CardSearch='';
// Suche: nur Wörter (Deutsch, Persisch, Lautschrift) – KEINE Tags.
// Ignoriert Leerzeichen und Groß-/Kleinschreibung.
function searchNorm(s,fa){ return Answer.normalize(s||'',fa).replace(/\s+/g,''); }
function cardMatches(c,q){
  const qn=searchNorm(q,false), qf=searchNorm(q,true);
  if(!qn && !qf) return true;
  const de=searchNorm(c.de.join(' '),false);
  const fa=c.fa.map(x=>searchNorm(x,true)).join('');
  const tr=searchNorm(c.translit||'',false);
  return de.includes(qn) || fa.includes(qf) || tr.includes(qn);
}
function filteredCards(){
  const q=CardSearch.trim();
  let list=DB.data.cards.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  return q ? list.filter(c=>cardMatches(c,q)) : list;
}

window.dupProceed=()=>{ if(Editor)Editor._dupAck=true; closeDialog(); saveEditor(); };

window.saveEditor=async function(){
  const E=Editor;
  const de=E.de.map(s=>s.trim()).filter(Boolean);
  const fa=E.fa.map(s=>s.trim()).filter(Boolean);
  if(!de.length||!fa.length){toast('Je Seite mind. ein Begriff');return;}
  // Duplikatwarnung (nur bei neuer Karte; nach Bestätigen übersprungen)
  if(!E.id && !E._dupAck){
    const dset=new Set(de.map(x=>x.toLowerCase())), fset=new Set(fa.map(x=>Answer.normalize(x,true)));
    const dup=DB.data.cards.find(c=>c.de.some(x=>dset.has(x.toLowerCase()))||c.fa.some(x=>fset.has(Answer.normalize(x,true))));
    if(dup){ showDupDialog(dup); return; }
  }
  let card=E.id?DB.data.cards.find(c=>c.id===E.id):null;
  if(!card){ card={id:uid(),state:'new',s:0,d:0,interval:0,reps:0,lapses:0,correct:0,wrong:0,lastReview:null,nextReview:null,lastTime:0,createdAt:now()}; DB.data.cards.push(card); }
  card.de=de;card.fa=fa;card.translit=E.translit.trim();card.tags=E.tags.slice();card.active=E.active;card.fav=E.fav;card.audio=E.audio;card.updatedAt=now();
  if(E._pendingAudio){ await AudioStore.put(card.id,E._pendingAudio); }
  DB.save(); closeEditor(); render(); toast('Gespeichert');
};

  const idx=DB.data.cards.findIndex(c=>c.id===E.id);
  if(idx>=0){ const card=DB.data.cards[idx]; if(card.audio)await AudioStore.del(card.id); DB.data.cards.splice(idx,1); DB.save(); }
  closeDialog(); closeEditor(); render(); toast('Karte gelöscht');
};
window.startRec=async function(){
  // Ursache genau bestimmen, damit die Meldung hilfreich ist.
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Mikrofon von dieser Umgebung gesperrt (nicht dein iPhone)');
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[]; mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
    mediaRecorder.onstop=()=>{ const blob=new Blob(recChunks,{type:recChunks[0]?.type||'audio/mp4'}); Editor._pendingAudio=blob; Editor.audio=true; stream.getTracks().forEach(t=>t.stop()); renderEditor(); };
    mediaRecorder.start(); renderEditor();
  }catch(e){
    const n=e&&e.name;
    if(n==='NotAllowedError'||n==='SecurityError') toast('Mikrofon blockiert – von der Vorschau, nicht vom iPhone');
    else if(n==='NotFoundError') toast('Kein Mikrofon gefunden');
    else toast('Aufnahme nicht möglich ('+(n||'unbekannt')+')');
  }
};
window.stopRec=()=>{ if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop(); };
window.playEditorAudio=async function(){ let blob=Editor._pendingAudio; if(!blob&&Editor.id)blob=await AudioStore.get(Editor.id); if(!blob){toast('Keine Aufnahme');return;} const u=URL.createObjectURL(blob);const a=new Audio(u);a.play();a.onended=()=>URL.revokeObjectURL(u); };
window.deleteEditorAudio=async function(){ Editor.audio=false; Editor._pendingAudio=null; if(Editor.id)await AudioStore.del(Editor.id); renderEditor(); };

  const tile=(ic,col,val,lbl)=>`<div class="card metric"><div class="ic" style="color:${col}">${ic}</div><div class="val">${val}</div><div class="lbl">${lbl}</div></div>`;
  return `<div class="nav-title">Statistik</div>
   <div class="metric-grid">
     ${tile('▤','var(--sage)',s.total,'Karten gesamt')}
     ${tile('✓','var(--turq)',s.active,'Aktiv')}
     ${tile('☀','var(--terra)',s.today,'Heute gelernt')}
     ${tile('🔥','var(--warn)',s.streak+' Tage','Serie')}
     ${tile('◎','var(--sage)',Math.round(s.rate*100)+'%','Erfolgsquote')}
     ${tile('⏱','var(--turq)',(s.avg?s.avg.toFixed(1)+'s':'–'),'Ø Antwortzeit')}
   </div>
   <div class="card" style="margin-top:12px"><div style="font-weight:600;font-size:14px">Wiederholungen (14 Tage)</div>
     <div class="bars">${s.perDay.map(v=>`<div style="height:${Math.max(2,v/maxBar*100)}%"></div>`).join('')}</div></div>
   <div class="card"><div style="font-weight:600;font-size:14px;margin-bottom:8px">Schwierigste Wörter</div>
     ${s.hardest.length?s.hardest.map(c=>`<div class="row" style="padding:3px 0"><span>${esc(c.de[0])}</span><span class="persian muted">${esc(c.fa[0])}</span></div>`).join(''):'<div class="muted small">Noch keine gelernten Karten.</div>'}</div>
   <div class="card"><div style="font-weight:600;font-size:14px;margin-bottom:8px">Häufigste Tags</div>
     ${s.topTags.length?`<div style="display:flex;flex-wrap:wrap;gap:8px">${s.topTags.map(([t,n])=>`<span class="chip">${esc(t)} (${n})</span>`).join('')}</div>`:'<div class="muted small">Noch keine Tags.</div>'}</div>
   <div style="height:12px"></div>`;
}

function backupFileName(){ return 'dariapp-backup-'+new Date().toISOString().slice(0,10)+'.json'; }

// Backup sichern: Text kopieren (zuverlässig auf iOS) + optional als Datei.
window.openBackup=function(){
  const name=backupFileName();
  const json=JSON.stringify(DB.data);
  const count=DB.data.cards.length;
  const root=document.getElementById('dialogRoot');
  root.innerHTML=`<div class="dlg-back" onclick="if(event.target===this)closeDialog()"><div class="dlg" style="max-width:440px">
    <button class="dlg-x" onclick="closeDialog()">✕</button>
    <div class="dlg-ic" style="color:var(--sage)">💾</div>
    <h3>Backup sichern</h3>
    <p>${count} Karten. Am sichersten: <b>Text kopieren</b> und dir per Mail oder Notiz schicken. (Audio ist nicht enthalten.)</p>
    <textarea id="backupText" readonly class="field" style="height:100px;font-family:monospace;font-size:11px;margin:0 0 8px">${esc(json)}</textarea>
    <label class="lbl" style="margin:0 2px 6px">Dateiname</label>
    <input id="backupName" class="field" style="margin:0 0 8px" value="${esc(name)}" autocapitalize="none" autocorrect="off">
    <div class="dlg-actions">
      <button class="pillbtn" onclick="copyBackup()">Text kopieren</button>
      <button class="pillbtn secondary" onclick="saveBackupFile()">Als Datei speichern</button>
    </div>
    <div class="hint" style="margin-top:10px">„Als Datei speichern" öffnet das Teilen-Menü → <b>In Dateien sichern</b>. Dort kannst du Ordner wählen und den Namen ändern. (Klappt am besten aus der zum Home‑Bildschirm hinzugefügten App.)</div></div></div>`;
};
window.copyBackup=async function(){
  const ta=document.getElementById('backupText');
  const json=ta?ta.value:JSON.stringify(DB.data);
  try{
    await navigator.clipboard.writeText(json);
    toast('In Zwischenablage kopiert ✓');
  }catch(e){
    if(ta){ ta.focus(); ta.select(); try{ta.setSelectionRange(0,json.length);}catch(_){} }
    toast('Text ist markiert – jetzt „Kopieren" antippen');
  }
};
window.saveBackupFile=async function(){
  const inp=document.getElementById('backupName');
  let name=(inp && inp.value.trim()) || backupFileName();
  if(!/\.json$/i.test(name)) name+='.json';
  const json=JSON.stringify(DB.data);
  const file=new File([json],name,{type:'application/json'});
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent||'') ||
              (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  // 1) iOS-Teilen-Menü -> „In Dateien sichern" (Ordnerwahl + Umbenennen)
  if(navigator.share){
    try{
      await navigator.share({files:[file], title:name});
      return; // Teilen-Menü hat geöffnet -> Nutzer speichert selbst in „Dateien"
    }catch(e){
      if(e && e.name==='AbortError') return; // Nutzer hat abgebrochen
      // sonst: Teilen ist gesperrt -> unten ehrlich melden
    }
  }
  // 2) Auf dem iPhone ohne funktionierendes Teilen: ehrliche Info statt Phantom-Download
  if(isIOS){
    showSaveBlocked();
    return;
  }
  // 3) Desktop/andere Browser: echter Download
  try{
    const url=URL.createObjectURL(file);
    const a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Gespeichert als '+name);
  }catch(e){ showSaveBlocked(); }
};
function showSaveBlocked(){
  const root=document.getElementById('dialogRoot');
  root.innerHTML=`<div class="dlg-back" onclick="if(event.target===this)closeDialog()"><div class="dlg" style="max-width:440px">
    <button class="dlg-x" onclick="closeDialog()">✕</button>
    <div class="dlg-ic">ℹ︎</div>
    <h3>„In Dateien" ist hier gesperrt</h3>
    <p>In dieser eingebetteten Ansicht lässt iOS das Speichern in die Dateien‑App nicht zu (dieselbe Sperre wie beim Mikrofon).</p>
    <p><b>So klappt es sicher:</b></p>
    <p>1) <b>Text kopieren</b> und dir per Mail/Notiz schicken – funktioniert immer.<br>
       2) Oder die App zuerst über <b>Teilen → „Zum Home‑Bildschirm"</b> installieren und von dort starten; dann öffnet „Als Datei speichern" das Dateien‑Fenster.</p>
    <div class="dlg-actions">
      <button class="pillbtn" onclick="openBackup()">Zurück zu „Text kopieren"</button>
      <button class="pillbtn secondary" onclick="closeDialog()">Schließen</button>
    </div></div></div>`;
}

// Backup wiederherstellen: Text einfügen oder Datei wählen.
window.openRestore=function(){
  const root=document.getElementById('dialogRoot');
  root.innerHTML=`<div class="dlg-back" onclick="if(event.target===this)closeDialog()"><div class="dlg" style="max-width:440px">
    <button class="dlg-x" onclick="closeDialog()">✕</button>
    <div class="dlg-ic">⟲</div>
    <h3>Backup wiederherstellen</h3>
    <p>Füge deinen kopierten Backup-Text ein. <b>Achtung:</b> die aktuellen Daten werden ersetzt.</p>
    <textarea id="restoreText" class="field" style="height:120px;font-family:monospace;font-size:11px;margin:0 0 4px" placeholder='Backup-Text hier einfügen…'></textarea>
    <div class="dlg-actions">
      <button class="pillbtn" onclick="restoreFromText()">Wiederherstellen</button>
      <button class="pillbtn secondary" onclick="closeDialog();document.getElementById('importFile').click()">Stattdessen Datei wählen</button>
    </div></div></div>`;
};
function applyImport(d){
  if(!d || !d.cards){ toast('Ungültiges Backup'); return; }
  DB.data=d;
  if(!DB.data.cards)DB.data.cards=[];
  if(!DB.data.logs)DB.data.logs=[];
  if(!DB.data.settings)DB.data.settings={appearance:'light',defaultMode:'flip',defaultDirection:'mixed',dailyGoal:20,animations:true};
  DB.save(); applyTheme(); closeDialog(); go('cards'); toast('Backup wiederhergestellt ✓');
}
window.restoreFromText=function(){
  const ta=document.getElementById('restoreText'); if(!ta)return;
  const txt=ta.value.trim(); if(!txt){ toast('Kein Text eingefügt'); return; }
  try{ applyImport(JSON.parse(txt)); }
  catch(e){ toast('Ungültiger Backup-Text'); }
};
window.importData=function(ev){
  const f=ev.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ applyImport(JSON.parse(r.result)); }catch(e){ toast('Ungültige Datei'); } };
  r.readAsText(f); ev.target.value='';
};
