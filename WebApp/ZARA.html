<style>
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface-2:#EFE9DE; --text:#2C2A24; --text-2:#726C5E;
  --sage:#8FA98C; --turq:#7FC5C0; --terra:#C77B58; --sand:#DCCEB5; --sep:#E3DCCF; --warn:#D9A441;
  --accent:#8FA98C; --shadow:rgba(0,0,0,.10);
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#19212A; --surface-2:#232E38; --text:#EDEAE3; --text-2:#98A2AC;
  --sage:#9DB89A; --turq:#7FC7C6; --terra:#D68A66; --sand:#2C333B; --sep:#2A343E; --warn:#E0B25C;
  --accent:#9DB89A; --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.persian{font-family:"SF Arabic","Geeza Pro","Vazirmatn","Segoe UI","Tahoma",serif;direction:rtl}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(12px,env(safe-area-inset-top)) 16px 16px}
.nav-title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 2px 16px}
.muted{color:var(--text-2)}
.card{background:var(--surface);border-radius:18px;padding:15px;box-shadow:0 6px 16px -8px var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.pillbtn{width:100%;background:var(--accent);color:#fff;font-weight:600;font-size:16px;padding:15px;border-radius:16px;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.pillbtn:disabled{opacity:.4}
.pillbtn.secondary{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:7px 13px;border-radius:999px;background:var(--surface-2);color:var(--text)}
.chip.on{background:var(--accent);color:#fff}
.chip .x{font-size:11px;opacity:.8}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;font-size:13px}
.seg>button{flex:1;text-align:center;padding:9px 4px;border-radius:9px;color:var(--text-2)}
.seg>button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.field{width:100%;background:var(--surface);border:1px solid var(--sep);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text);margin-bottom:8px}
.field:focus{outline:2px solid var(--accent);outline-offset:0}
label.lbl{font-weight:600;font-size:14px;display:block;margin:16px 2px 8px}
.tabbar{flex:0 0 auto;display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--sep);background:color-mix(in srgb,var(--surface) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text-2);padding:6px 14px;border-radius:12px}
.tab.active{color:var(--accent)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--accent);background:var(--surface-2)}
.term-de{font-size:16px;font-weight:600}
.term-fa{font-size:19px;color:var(--text-2)}
.tag-line{font-size:12px;color:var(--sage);margin-top:3px}
.badges{display:flex;flex-direction:column;gap:5px;align-items:end;font-size:14px}
/* Lernkarte */
.flip{position:relative;min-height:230px;perspective:1200px}
.flip-face{background:var(--surface);border-radius:26px;padding:32px 22px;box-shadow:0 12px 28px -14px var(--shadow);text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.term-big{font-size:34px;font-weight:600;line-height:1.2}
.term-big.fa{font-size:44px;font-weight:500}
.translit{font-style:italic;color:var(--text-2);font-size:17px;font-family:Georgia,serif}
.audiobtn{font-size:36px;color:var(--turq);line-height:1}
.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.rating button{color:#fff;font-size:12px;font-weight:600;padding:12px 2px;border-radius:12px}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:4px 2px 16px}
.progress>div{height:100%;background:var(--accent);transition:width .3s ease}
.choice{width:100%;text-align:center;padding:15px;border-radius:16px;background:var(--surface);border:1px solid var(--sep);font-size:17px;margin-bottom:10px;color:var(--text)}
.choice.correct{background:var(--sage);color:#fff;border-color:transparent}
.choice.wrong{background:var(--terra);color:#fff;border-color:transparent}
.choice.dim{opacity:.5}
.feedback{text-align:center;font-weight:600;margin:14px 0;font-size:17px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.metric .ic{font-size:16px}.metric .val{font-size:24px;font-weight:700;margin-top:6px}.metric .lbl{font-size:12px;color:var(--text-2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:12px}
.bars>div{flex:1;background:var(--sage);border-radius:3px 3px 0 0;min-height:2px}
.toggle{position:relative;width:50px;height:30px;border-radius:999px;background:var(--surface-2);transition:.2s}
.toggle.on{background:var(--sage)}
.toggle>span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on>span{left:23px}
.modal{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.modal .screen{padding-top:max(16px,env(safe-area-inset-top))}
.empty{text-align:center;padding:50px 20px;color:var(--text-2)}
.empty .big{font-size:44px;margin-bottom:12px}
.hidden{display:none!important}
.fadein{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
[data-noanim] *{animation:none!important;transition:none!important}
.small{font-size:13px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);font-size:20px;font-weight:600}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
a{color:var(--sage)}
.dlg-back{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.5);animation:fade .2s ease}
.dlg{background:var(--surface);border-radius:20px;padding:22px;max-width:340px;width:100%;box-shadow:0 24px 60px -14px rgba(0,0,0,.6);position:relative}
.dlg .dlg-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px;color:var(--text-2);background:var(--surface-2)}
.dlg .dlg-ic{font-size:26px;color:var(--warn)}
.dlg h3{margin:8px 0 6px;font-size:18px;font-weight:700}
.dlg p{margin:0 0 8px;color:var(--text-2);font-size:14px;line-height:1.5}
.dlg .dup-word{color:var(--text);font-weight:600}
.dlg .dlg-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.editor-head{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--sep)}
.btn-danger{width:100%;background:var(--terra);color:#fff;font-weight:600;font-size:15px;padding:14px;border-radius:14px}
.chip{-webkit-touch-callout:none;user-select:none}

<script>
"use strict";
/* ===== 00-util.js ===== */
/* ============================================================
   ZARA – Web-Version (PWA). Vollständig offline, lokal.
   00-util: kleine, seiteneffektfreie Hilfsfunktionen.
   ============================================================ */

const APP_NAME = 'ZARA';
const APP_VERSION = '3.0 · Okt 2026';   // zum Prüfen, ob die neueste Version geladen ist
const DAY = 86400000;

const now = () => Date.now();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

/** HTML-Escape für Text UND Attributwerte (inkl. Apostroph). */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** Fisher-Yates; rng injizierbar (Tests). Gibt eine Kopie zurück. */
function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Beginn des lokalen Kalendertags (ms). */
function startOfDay(ts) {
  const d = new Date(ts == null ? now() : ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

/** Lokaler Tagesschlüssel „YYYY-MM-DD". */
function dayKey(ts) {
  const d = new Date(ts == null ? now() : ts);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/** Schnelle, stabile 32-Bit-Prüfsumme (FNV-1a) als Hex-String. */
function checksum(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

/** Tiefe Kopie für reine JSON-Daten. */
const clone = o => JSON.parse(JSON.stringify(o));

/** Nimmt bis zu n zufällige Elemente. */
function sample(arr, n, rng = Math.random) { return shuffle(arr, rng).slice(0, n); }

/* ===== 10-fsrs.js ===== */
/* ---------- FSRS 4.5 ----------
   Free Spaced Repetition Scheduler. Rein funktional.
   KORREKTUR gegenüber v2.0: Die Anfangsschwierigkeit D0 und die
   Mittelwert-Rückkehr nutzen jetzt die FSRS-4.5-Formeln. Zuvor wurde die
   FSRS-5-Formel mit 4.5-Gewichten kombiniert, wodurch „Gut"/„Leicht" bei der
   ersten Antwort Schwierigkeit 1,0 statt ~5,2 bzw. ~3,9 ergaben. */
const FSRS = {
  w: [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.0310, 1.6474,
      0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.5870, 0.2272, 2.8755],
  retention: 0.90, maxInterval: 365, decay: -0.5, factor: 19 / 81,

  /** Abrufwahrscheinlichkeit nach t Tagen bei Stabilität S. */
  R(t, S) { if (S <= 0) return 0; return Math.pow(1 + this.factor * t / S, this.decay); },
  /** D0(G) = w4 − (G − 3)·w5 */
  initD(g) { return clamp(this.w[4] - (g - 3) * this.w[5], 1, 10); },
  initS(g) { return Math.max(this.w[g - 1], 0.1); },
  /** D' = D − w6·(G − 3), danach Mittelwert-Rückkehr zu w4. */
  nextD(d, g) {
    const nd = d - this.w[6] * (g - 3);
    return clamp(this.w[7] * this.w[4] + (1 - this.w[7]) * nd, 1, 10);
  },
  recallS(d, s, r, g) {
    const hard = (g === 2) ? this.w[15] : 1;
    const easy = (g === 4) ? this.w[16] : 1;
    const f = Math.exp(this.w[8]) * (11 - d) * Math.pow(s, -this.w[9])
      * (Math.exp(this.w[10] * (1 - r)) - 1) * hard * easy;
    return s * (1 + f);
  },
  forgetS(d, s, r) {
    return this.w[11] * Math.pow(d, -this.w[12]) * (Math.pow(s + 1, this.w[13]) - 1)
      * Math.exp(this.w[14] * (1 - r));
  },
  interval(S) {
    const raw = S / this.factor * (Math.pow(this.retention, 1 / this.decay) - 1);
    return clamp(Math.round(raw), 1, this.maxInterval);
  },
  /** card: {state,s,d,lastReview}; g: 1..4. Gibt neue Werte zurück (mutiert nicht). */
  schedule(card, g, reviewDate) {
    const elapsed = card.lastReview ? Math.max((reviewDate - card.lastReview) / DAY, 0) : 0;
    let nd, ns, nstate;
    if (card.state === 'new' || !card.state) {
      nd = this.initD(g); ns = this.initS(g); nstate = (g === 1) ? 'learning' : 'review';
    } else {
      const r = this.R(elapsed, card.s || 0);
      nd = this.nextD(card.d || 5, g);
      if (g === 1) { ns = this.forgetS(nd, card.s || 0.1, r); nstate = 'relearning'; }
      else { ns = this.recallS(nd, card.s || 0.1, r, g); nstate = 'review'; }
    }
    ns = Math.max(ns, 0.1);
    const iv = this.interval(ns);
    return { s: ns, d: clamp(nd, 1, 10), state: nstate, interval: iv, due: reviewDate + iv * DAY };
  },
  /** Schwierigkeit aus einer Bewertungsfolge neu herleiten (Migration v2→v3). */
  replayD(ratings) {
    if (!ratings.length) return null;
    let d = this.initD(ratings[0]);
    for (let i = 1; i < ratings.length; i++) d = this.nextD(d, ratings[i]);
    return d;
  }
};

/* ===== 20-answer.js ===== */
/* ---------- Antwortprüfung ----------
   Ergebnis: 'perfect' | 'typo' | 'wrong'.
   Regeln: Groß-/Kleinschreibung, Leerzeichen und Satzzeichen am Rand zählen
   nicht. Persisch: Zeichenvarianten (arabisches Ya/Kaf), Diakritika und
   Halbleerzeichen (ZWNJ) werden vereinheitlicht, Ziffern ۱۲۳ = 123.
   Das „آ" (Alef mit Madda) bleibt unterscheidbar: „اب" statt „آب" ist nur
   ein Tippfehler. Deutsch: ä/ö/ü/ß dürfen als ae/oe/ue/ss getippt werden;
   ein fehlender Artikel zählt als Tippfehler. */
const Answer = {
  persianMap: { 'ي': 'ی', 'ك': 'ک', 'ۀ': 'ه', 'ة': 'ه', 'أ': 'ا', 'إ': 'ا', 'ؤ': 'و', 'ى': 'ی' },
  strip: new Set(['ً', 'ٌ', 'ٍ', 'َ', 'ُ', 'ِ', 'ّ',
    'ْ', 'ٰ', 'ـ', '‌', '‍', '﻿']),
  edgePunct: /^[\s.,;:!?'"“”„‚‘’«»()\[\]\-–—…،؛؟]+|[\s.,;:!?'"“”„‚‘’«»()\[\]\-–—…،؛؟]+$/g,
  articles: ['der', 'die', 'das', 'ein', 'eine', 'einen', 'einem', 'einer', 'den', 'dem', 'des'],

  digits(s) {
    return s.replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660))
            .replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0));
  },
  normalize(t, fa) {
    let s = String(t == null ? '' : t).normalize('NFC').trim().toLowerCase();
    s = this.digits(s).replace(this.edgePunct, '');
    s = s.split(/\s+/).filter(Boolean).join(' ');
    if (fa) s = [...s].map(c => this.persianMap[c] || c).filter(c => !this.strip.has(c)).join('');
    return s;
  },
  /** Gröbere Faltung: nur für den „zählt als Variante"-Vergleich. */
  fold(s, fa) {
    if (fa) return s.replace(/آ/g, 'ا');
    return s.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
  },
  lev(a, b) {
    a = [...a]; b = [...b];
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i), cur = new Array(b.length + 1);
    for (let i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      [prev, cur] = [cur, prev];
    }
    return prev[b.length];
  },
  stripArticle(s) {
    const i = s.indexOf(' ');
    if (i > 0 && this.articles.includes(s.slice(0, i))) return s.slice(i + 1);
    return s;
  },
  evaluate(input, solutions, fa) {
    const ni = this.normalize(input, fa);
    if (!ni) return 'wrong';
    const sols = (solutions || []).map(s => this.normalize(s, fa)).filter(Boolean);
    if (sols.includes(ni)) return 'perfect';
    const fi = this.fold(ni, fa);
    let best = 'wrong';
    for (const s of sols) {
      const fs = this.fold(s, fa);
      if (fi === fs) {
        if (!fa) return 'perfect';          // ae/oe/ue/ss-Schreibweise ist korrekt
        best = 'typo'; continue;            // آ/ا-Verwechslung
      }
      if (!fa && this.stripArticle(s) === ni && s !== ni) { best = 'typo'; continue; }
      const d = this.lev(fi, fs);
      const tol = fs.length >= 4 ? 1 : 0;
      if (d > 0 && d <= tol) best = 'typo';
    }
    return best;
  },
  /** Satzbewertung: Toleranz wächst mit der Länge (max. ~8 %). */
  evaluateSentence(input, solutions, fa) {
    const ni = this.fold(this.normalize(input, fa), fa);
    if (!ni) return 'wrong';
    let best = 'wrong';
    for (const sol of solutions) {
      const ns = this.fold(this.normalize(sol, fa), fa);
      if (ni === ns) return 'perfect';
      const tol = Math.max(1, Math.floor(ns.length * 0.08));
      if (this.lev(ni, ns) <= tol) best = 'typo';
    }
    return best;
  }
};
function ratingFromQuality(q, fast) { if (q === 'perfect') return fast ? 4 : 3; if (q === 'typo') return 2; return 1; }

/* ===== 30-content.js ===== */
/* ============================================================
   30-content: eingebaute Übungsinhalte (Sätze + Grammatik).
   Persisch: Standard-Schriftsprache (Halbleerzeichen/ZWNJ in می‌ … ها).
   HINWEIS: Bitte von einer Person mit Persisch-Kenntnissen gegenlesen.

   Wortarten (pd = Deutsch, pf = Persisch; je Token ein Buchstabe):
   P Pronomen · N Nomen · V Verb · A Adjektiv · D Adverb/Frage · R Präposition · X Sonstiges
   ============================================================ */

const BLANK_POS = 'NVAD';   // Wortarten, die als Lücke taugen

/** S(id, Kategorie, Stufe, de, fa, Lautschrift, pd, pf, Optionen) – Frage-Sätze mit q:1. */
function S(id, cat, lvl, de, fa, tr, pd, pf, o = {}) {
  const q = !!o.q;
  const tk = s => s.split(' ');
  const dt = tk(de), ft = tk(fa);
  return {
    id, cat, lvl, q,
    deT: dt, faT: ft,
    de: de + (q ? '?' : '.'), fa: fa + (q ? '؟' : '.'), tr,
    pd: pd.split(' '), pf: pf.split(' '),
    bd: o.bd || null, bf: o.bf || null,     // erlaubte Lücken-Positionen (optional)
    alts: o.alts || []                       // weitere zulässige persische Wortfolgen (als Strings)
  };
}

/* ===== 40-storage.js ===== */
/* ============================================================
   40-storage: Persistenz mit Schema-Versionen, Migration,
   Schnappschüssen und Wiederherstellung.

   Grundregeln (Datensicherheit hat Vorrang vor allem anderen):
   1. Der Hauptdatensatz (localStorage „dariapp.v1") wird NIE überschrieben,
      solange er nicht erfolgreich gelesen und geprüft wurde.
   2. Ist er defekt, wird der Rohtext in einen Quarantäne-Schlüssel kopiert,
      und die App startet im Wiederherstellungsmodus (Speichern gesperrt).
   3. Vor jeder Migration und vor jeder Wiederherstellung entsteht eine
      Sicherheitskopie (synchron in localStorage + Schnappschuss in IndexedDB).
   4. Jeder Schreibvorgang wird zurückgelesen und verglichen.
   ============================================================ */

const SCHEMA = 3;

const DEFAULT_SETTINGS = () => ({
  appearance: 'light', defaultMode: 'flip', defaultDirection: 'mixed',
  dailyGoal: 20, animations: true, haptics: true
});

function emptyData() {
  return { schemaVersion: SCHEMA, cards: [], logs: [], logArchive: {}, sent: {},
    settings: DEFAULT_SETTINGS(), meta: { createdAt: now() } };
}

/* ---------- Prüfen, Reparieren, Migrieren ---------- */
const Schema = {
  STATES: ['new', 'learning', 'review', 'relearning'],
  MODES: ['flip', 'mc', 'write'],
  DIRS: ['g2p', 'p2g', 'mixed'],
  APPEARANCE: ['system', 'light', 'dark'],

  num(v, d = 0) { return (typeof v === 'number' && isFinite(v)) ? v : d; },
  numOrNull(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; },
  strList(v) {
    if (typeof v === 'string') v = [v];
    if (!Array.isArray(v)) return [];
    return v.filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean);
  },

  /** Repariert eine Karte (oder gibt null zurück, wenn sie keinerlei Inhalt hat). */
  fixCard(c, issues) {
    if (!c || typeof c !== 'object' || Array.isArray(c)) { issues.push('Ungültiger Karteneintrag'); return null; }
    const de = this.strList(c.de), fa = this.strList(c.fa);
    if (!de.length && !fa.length) { issues.push('Leere Karte entfernt'); return null; }
    const t = now();
    const out = {
      id: (typeof c.id === 'string' && c.id) ? c.id : uid(),
      de, fa,
      translit: typeof c.translit === 'string' ? c.translit : '',
      tags: this.strList(c.tags),
      audio: !!c.audio,
      active: c.active !== false,
      fav: !!c.fav,
      state: this.STATES.includes(c.state) ? c.state : 'new',
      s: Math.max(this.num(c.s), 0), d: this.num(c.d),
      interval: Math.max(Math.round(this.num(c.interval)), 0),
      reps: Math.max(Math.round(this.num(c.reps)), 0),
      lapses: Math.max(Math.round(this.num(c.lapses)), 0),
      correct: Math.max(Math.round(this.num(c.correct)), 0),
      wrong: Math.max(Math.round(this.num(c.wrong)), 0),
      miss: Math.max(Math.round(this.num(c.miss)), 0),
      lastReview: this.numOrNull(c.lastReview),
      nextReview: this.numOrNull(c.nextReview),
      lastTime: Math.max(this.num(c.lastTime), 0),
      createdAt: this.num(c.createdAt, t),
      updatedAt: this.num(c.updatedAt, this.num(c.createdAt, t)),
      exDe: typeof c.exDe === 'string' ? c.exDe : '',
      exFa: typeof c.exFa === 'string' ? c.exFa : ''
    };
    // Unbekannte Zusatzfelder bleiben erhalten (Vorwärtskompatibilität).
    for (const k of Object.keys(c)) if (!(k in out)) out[k] = c[k];
    if (out.state === 'new' && out.reps === 0) { out.s = 0; out.d = 0; }
    return out;
  },

  fixLog(l) {
    if (!l || typeof l !== 'object') return null;
    const date = this.numOrNull(l.date);
    if (date == null) return null;
    const out = {
      date, rating: clamp(Math.round(this.num(l.rating, 3)), 1, 4),
      time: Math.max(this.num(l.time), 0),
      mode: typeof l.mode === 'string' ? l.mode : 'flip'
    };
    if (typeof l.cardId === 'string') out.cardId = l.cardId;
    if (typeof l.itemId === 'string') out.itemId = l.itemId;
    if (l.p) out.p = 1;      // Übungswiederholung (zählt nicht fürs Tagesziel)
    if (l.wk) out.wk = 1;    // schwieriges Wort richtig beantwortet
    return out;
  },

  fixSettings(s) {
    const d = DEFAULT_SETTINGS();
    s = (s && typeof s === 'object') ? s : {};
    return {
      appearance: this.APPEARANCE.includes(s.appearance) ? s.appearance : d.appearance,
      defaultMode: this.MODES.includes(s.defaultMode) ? s.defaultMode : d.defaultMode,
      defaultDirection: this.DIRS.includes(s.defaultDirection) ? s.defaultDirection : d.defaultDirection,
      dailyGoal: clamp(Math.round(this.num(s.dailyGoal, d.dailyGoal)), 5, 200),
      animations: s.animations !== false,
      haptics: s.haptics !== false
    };
  },

  /** Vollständige Prüfung + Reparatur. Mutiert die Eingabe nicht. */
  sanitize(input) {
    const issues = [];
    const d = (input && typeof input === 'object' && !Array.isArray(input)) ? input : {};
    const seen = new Set();
    const cards = [];
    for (const raw of (Array.isArray(d.cards) ? d.cards : [])) {
      const c = this.fixCard(raw, issues);
      if (!c) continue;
      if (seen.has(c.id)) { c.id = uid(); issues.push('Doppelte Karten-ID repariert'); }
      seen.add(c.id); cards.push(c);
    }
    let droppedLogs = 0;
    const logs = [];
    for (const raw of (Array.isArray(d.logs) ? d.logs : [])) {
      const l = this.fixLog(raw);
      if (l) logs.push(l); else droppedLogs++;
    }
    if (droppedLogs) issues.push(droppedLogs + ' ungültige Verlaufseinträge entfernt');
    const archive = {};
    if (d.logArchive && typeof d.logArchive === 'object') {
      for (const [k, v] of Object.entries(d.logArchive)) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v && typeof v === 'object') {
          archive[k] = { n: Math.max(this.num(v.n), 0), ok: Math.max(this.num(v.ok), 0),
            t: Math.max(this.num(v.t), 0), xp: Math.max(this.num(v.xp), 0) };
        }
      }
    }
    const sent = {};
    if (d.sent && typeof d.sent === 'object') {
      for (const [k, v] of Object.entries(d.sent)) {
        if (v && typeof v === 'object') {
          sent[k] = { box: clamp(Math.round(this.num(v.box)), 0, 5), due: this.num(v.due),
            ok: Math.max(this.num(v.ok), 0), bad: Math.max(this.num(v.bad), 0), last: this.num(v.last) };
        }
      }
    }
    const meta = (d.meta && typeof d.meta === 'object') ? clone(d.meta) : {};
    if (!meta.createdAt) meta.createdAt = now();
    const out = {
      schemaVersion: this.num(d.schemaVersion, 2),
      cards, logs, logArchive: archive, sent,
      settings: this.fixSettings(d.settings), meta
    };
    // Unbekannte Top-Level-Felder erhalten
    for (const k of Object.keys(d)) if (!(k in out)) out[k] = d[k];
    return { data: out, issues };
  },

  /** Migrationsschritte. Jeder Schritt hebt schemaVersion um 1. */
  steps: {
    // v2 (PWA bis 2.0) → v3 (ZARA): Schwierigkeit mit korrigierter FSRS-Formel
    // aus dem Verlauf neu herleiten. Termine (nextReview), Stabilität und
    // Zustand bleiben UNVERÄNDERT – es geht nichts verloren.
    2(d) {
      const byCard = new Map();
      for (const l of d.logs) {
        if (!l.cardId) continue;
        if (!byCard.has(l.cardId)) byCard.set(l.cardId, []);
        byCard.get(l.cardId).push(l);
      }
      let recalculated = 0;
      for (const c of d.cards) {
        if (c.reps > 0 && byCard.has(c.id)) {
          const ratings = byCard.get(c.id).sort((a, b) => a.date - b.date).map(l => l.rating);
          const nd = FSRS.replayD(ratings);
          if (nd != null) { c.d = nd; recalculated++; }
        }
      }
      d.meta.migration = { from: 2, to: 3, at: now(), difficultyRecalculated: recalculated };
    }
  },

  migrate(d) {
    const from = d.schemaVersion;
    const applied = [];
    if (from > SCHEMA) return { data: d, from, applied, tooNew: true };
    let v = from;
    while (v < SCHEMA) {
      const step = this.steps[v];
      if (step) step(d);
      v++; applied.push(v);
    }
    d.schemaVersion = SCHEMA;
    return { data: d, from, applied, tooNew: false };
  }
};

/* ---------- Schnappschüsse (IndexedDB) ---------- */
const SnapBackend = {
  _db: null,
  open() {
    return new Promise(res => {
      if (this._db) return res(this._db);
      if (typeof indexedDB === 'undefined') return res(null);
      let r;
      try { r = indexedDB.open('zara-backups', 1); } catch (e) { return res(null); }
      r.onupgradeneeded = () => { r.result.createObjectStore('snaps', { keyPath: 'id' }); };
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    });
  },
  async put(rec) {
    const db = await this.open(); if (!db) return false;
    return new Promise(res => {
      const t = db.transaction('snaps', 'readwrite');
      t.objectStore('snaps').put(rec);
      t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false);
    });
  },
  async all() {
    const db = await this.open(); if (!db) return [];
    return new Promise(res => {
      const q = db.transaction('snaps', 'readonly').objectStore('snaps').getAll();
      q.onsuccess = () => res(q.result || []); q.onerror = () => res([]);
    });
  },
  async remove(id) {
    const db = await this.open(); if (!db) return false;
    return new Promise(res => {
      const t = db.transaction('snaps', 'readwrite');
      t.objectStore('snaps').delete(id);
      t.oncomplete = () => res(true); t.onerror = () => res(false);
    });
  }
};

/* ---------- Audio (IndexedDB) – gleiche DB wie in v2.0, damit Aufnahmen erhalten bleiben ---------- */
const AudioStore = {
  _db: null,
  open() {
    return new Promise(res => {
      if (this._db) return res(this._db);
      if (typeof indexedDB === 'undefined') return res(null);
      let r;
      try { r = indexedDB.open('dariapp-audio', 1); } catch (e) { return res(null); }
      r.onupgradeneeded = () => { r.result.createObjectStore('audio'); };
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => res(null);
    });
  },
  async put(id, blob) {
    const db = await this.open(); if (!db) return false;
    return new Promise(r => { const t = db.transaction('audio', 'readwrite'); t.objectStore('audio').put(blob, id);
      t.oncomplete = () => r(true); t.onerror = () => r(false); });
  },
  async get(id) {
    const db = await this.open(); if (!db) return null;
    return new Promise(r => { const q = db.transaction('audio', 'readonly').objectStore('audio').get(id);
      q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); });
  },
  async del(id) {
    const db = await this.open(); if (!db) return false;
    return new Promise(r => { const t = db.transaction('audio', 'readwrite'); t.objectStore('audio').delete(id);
      t.oncomplete = () => r(true); t.onerror = () => r(false); });
  }
};

/* ---------- Der Speicher ---------- */
const Store = {
  KEY: 'dariapp.v1',                 // UNVERÄNDERT: hier liegen die bestehenden Nutzerdaten
  PREV: 'dariapp.v1.prev',           // letzter bekannter guter Stand (synchron)
  QUAR: 'dariapp.v1.quarantine.',    // Rohtext defekter Datensätze
  ls: null,
  snaps: SnapBackend,
  data: emptyData(),
  mode: 'ok',                        // 'ok' | 'recovery'
  recovery: null,
  lastSaveError: null,
  onSaveError: null,
  info: null,

  attach(ls) { this.ls = ls; return this; },

  _get(k) { try { return this.ls.getItem(k); } catch (e) { return null; } },
  _set(k, v) { try { this.ls.setItem(k, v); return true; } catch (e) { return false; } },

  _parse(raw) {
    if (typeof raw !== 'string' || !raw.trim()) return null;
    try {
      const p = JSON.parse(raw);
      return (p && typeof p === 'object' && !Array.isArray(p)) ? p : null;
    } catch (e) { return null; }
  },

  _quarantine(raw) {
    const key = this.QUAR + now();
    this._set(key, raw);
    // Nur die 3 neuesten Quarantäne-Einträge behalten.
    try {
      const keys = [];
      for (let i = 0; i < this.ls.length; i++) { const k = this.ls.key(i); if (k && k.startsWith(this.QUAR)) keys.push(k); }
      keys.sort().slice(0, Math.max(0, keys.length - 3)).forEach(k => { try { this.ls.removeItem(k); } catch (e) {} });
    } catch (e) {}
    return key;
  },

  /** Synchrones Laden. Gibt Infos über den Ablauf zurück, wirft nie. */
  load() {
    const info = { fresh: false, recovered: null, migratedFrom: null, issues: [], recovery: false,
      tooNew: false, quarantineKey: null };
    this.mode = 'ok'; this.recovery = null;
    const raw = this._get(this.KEY);
    let parsed = this._parse(raw);
    let source = 'main';

    if (raw == null) {
      // Kein Hauptdatensatz. Gab es einen letzten guten Stand?
      const prevParsed = this._parse(this._get(this.PREV));
      if (prevParsed) { parsed = prevParsed; source = 'prev'; info.recovered = 'prev'; }
      else { info.fresh = true; this.data = emptyData(); this.info = info; return info; }
    } else if (!parsed) {
      // Defekt: Rohtext sichern, auf letzten guten Stand zurückgreifen – NICHT überschreiben.
      info.quarantineKey = this._quarantine(raw);
      const prevParsed = this._parse(this._get(this.PREV));
      if (prevParsed) { parsed = prevParsed; source = 'prev'; info.recovered = 'prev'; }
      else {
        this.mode = 'recovery'; info.recovery = true;
        this.recovery = { reason: 'corrupt', rawLength: raw.length, quarantineKey: info.quarantineKey };
        this.data = emptyData(); this.info = info; return info;
      }
    }

    const { data, issues } = Schema.sanitize(parsed);
    info.issues = issues;
    if (data.schemaVersion > SCHEMA) {
      // Daten stammen aus einer neueren App-Version: nichts anfassen.
      info.tooNew = true; this.mode = 'recovery'; info.recovery = true;
      this.recovery = { reason: 'tooNew', version: data.schemaVersion };
      this.data = emptyData(); this.info = info; return info;
    }
    const needsMigration = data.schemaVersion < SCHEMA;
    if (needsMigration || issues.length || source === 'prev') {
      // Vor jeder Veränderung: Original synchron sichern.
      if (raw != null) this._set(this.PREV + '.premigration', raw);
    }
    if (needsMigration) {
      info.migratedFrom = data.schemaVersion;
      Schema.migrate(data);
    }
    this.data = data;
    info.needsSave = needsMigration || issues.length > 0 || source === 'prev';
    info.preMigration = needsMigration || issues.length > 0;
    info.originalRaw = info.preMigration ? raw : null;
    this.info = info;
    return info;
  },

  save() {
    if (this.mode !== 'ok' || !this.ls) return false;
    try {
      this.data.meta.lastSaved = now();
      const json = JSON.stringify(this.data);
      this.ls.setItem(this.KEY, json);
      if (this.ls.getItem(this.KEY) !== json) throw new Error('Rücklese-Prüfung fehlgeschlagen');
      this.lastSaveError = null;
      return true;
    } catch (e) {
      this.lastSaveError = e;
      if (this.onSaveError) try { this.onSaveError(e); } catch (_) {}
      return false;
    }
  },

  /** Letzten guten Stand höchstens alle 24 h synchron festhalten. */
  rotatePrev() {
    if (this.mode !== 'ok') return;
    const m = this.data.meta;
    if (this.data.cards.length && (!m.prevAt || now() - m.prevAt > DAY)) {
      const raw = this._get(this.KEY);
      if (raw && this._parse(raw)) { if (this._set(this.PREV, raw)) m.prevAt = now(); }
    }
  },

  /* ----- Schnappschüsse ----- */
  /** `rawJson`: expliziter Text (z. B. der Originalstand VOR einer Migration). */
  async snapshot(reason, throttleMs = 0, rawJson = null) {
    if (this.mode !== 'ok' && !rawJson) return null;
    const m = this.data.meta;
    m.lastSnap = m.lastSnap || {};
    if (throttleMs && now() - (m.lastSnap[reason] || 0) < throttleMs) return null;
    const json = rawJson || JSON.stringify(this.data);
    const src = rawJson ? (this._parse(rawJson) || {}) : this.data;
    const rec = { id: now() + '-' + Math.random().toString(36).slice(2, 6), at: now(), reason,
      cards: Array.isArray(src.cards) ? src.cards.length : 0,
      logs: Array.isArray(src.logs) ? src.logs.length : 0, size: json.length, json };
    const ok = await this.snaps.put(rec);
    if (ok) { m.lastSnap[reason] = now(); await this.pruneSnapshots(); return rec; }
    return null;
  },
  async listSnapshots() {
    const all = await this.snaps.all();
    return all.map(r => ({ id: r.id, at: r.at, reason: r.reason, cards: r.cards, logs: r.logs, size: r.size }))
      .sort((a, b) => b.at - a.at);
  },
  async getSnapshot(id) {
    const all = await this.snaps.all();
    return all.find(r => r.id === id) || null;
  },
  async pruneSnapshots() {
    const all = (await this.snaps.all()).sort((a, b) => b.at - a.at);
    const auto = all.filter(r => r.reason === 'auto');
    const other = all.filter(r => r.reason !== 'auto');
    for (const r of auto.slice(7)) await this.snaps.remove(r.id);
    for (const r of other.slice(8)) await this.snaps.remove(r.id);
  },
  /** Täglicher automatischer Schnappschuss (nur wenn Daten vorhanden). */
  async autoSnapshot() {
    if (this.mode !== 'ok' || !this.data.cards.length) return null;
    const m = this.data.meta;
    if (m.lastAutoSnapshot && now() - m.lastAutoSnapshot < 20 * 3600 * 1000) return null;
    const rec = await this.snapshot('auto');
    if (rec) { m.lastAutoSnapshot = now(); this.save(); }
    return rec;
  },

  /* ----- Aufnahmen gelöschter Karten bleiben 30 Tage erhalten (Rückgängig-Schutz) ----- */
  markOrphan(cardId) {
    const m = this.data.meta; m.orphans = m.orphans || {}; m.orphans[cardId] = now();
  },
  async purgeOrphans() {
    const m = this.data.meta; if (!m.orphans) return 0;
    const live = new Set(this.data.cards.map(c => c.id));
    let n = 0;
    for (const [id, ts] of Object.entries(m.orphans)) {
      if (live.has(id)) { delete m.orphans[id]; continue; }
      if (now() - ts > 30 * DAY) { await AudioStore.del(id); delete m.orphans[id]; n++; }
    }
    return n;
  },

  /** Persistenten Speicher anfragen (verhindert Löschen durch iOS bei Platzmangel). */
  async requestPersistence() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        const ok = await navigator.storage.persist();
        this.data.meta.persisted = !!ok;
        return ok;
      }
    } catch (e) {}
    return false;
  },

  /** Verlauf älter als `keepDays` zu Tageswerten verdichten (hält localStorage klein). */
  compactLogs(keepDays = 180) {
    const cutoff = startOfDay(now() - keepDays * DAY);
    const old = this.data.logs.filter(l => l.date < cutoff);
    if (old.length < 200) return 0;
    const arch = this.data.logArchive;
    for (const l of old) {
      const k = dayKey(l.date);
      const a = arch[k] || (arch[k] = { n: 0, ok: 0, t: 0, xp: 0 });
      a.n++; if (l.rating !== 1) a.ok++; a.t += l.time; a.xp += xpForLog(l);
    }
    this.data.logs = this.data.logs.filter(l => l.date >= cutoff);
    return old.length;
  }
};

const DB = Store;   // gleiche Instanz; kürzerer Name in Oberfläche und Engine

/** Erfahrungspunkte je Antwort – belohnt richtiges Abrufen, Mühe und das Üben schwieriger Wörter. */
function xpForLog(l) {
  let xp = l.rating >= 4 ? 12 : l.rating === 3 ? 10 : l.rating === 2 ? 6 : 2;
  if (l.wk && l.rating >= 3) xp += 5;
  if (l.p) xp = Math.round(xp / 2);
  return xp;
}

/* ===== 45-backup.js ===== */
/* ============================================================
   45-backup: Export, Prüfung, Wiederherstellung, Zusammenführen.
   Das Format „zara-backup" ist plattformübergreifend (PWA ↔ iOS-App).
   Auch alte Backups der Version 2.0 (nackte Datenstruktur) werden gelesen.
   ============================================================ */

async function blobToB64(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = '';
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBlob(b64, type) {
  const bin = atob(b64), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: type || 'audio/mp4' });
}

const Backup = {
  FORMAT: 'zara-backup',
  VERSION: 3,
  lastUndo: null,

  fileName() { return 'zara-backup-' + dayKey() + '.json'; },

  /** Baut den Backup-Text. includeAudio: Aufnahmen als Base64 anhängen. */
  async build({ includeAudio = false } = {}) {
    const data = clone(Store.data);
    const dataJson = JSON.stringify(data);
    const out = {
      format: this.FORMAT, formatVersion: this.VERSION, source: 'zara-web',
      appVersion: APP_VERSION, createdAt: now(),
      counts: { cards: data.cards.length, logs: data.logs.length },
      checksum: checksum(dataJson), data
    };
    let audioCount = 0;
    if (includeAudio) {
      out.audio = {};
      for (const c of data.cards) {
        if (!c.audio) continue;
        const blob = await AudioStore.get(c.id);
        if (blob) { out.audio[c.id] = { type: blob.type || 'audio/mp4', b64: await blobToB64(blob) }; audioCount++; }
      }
    }
    return { json: JSON.stringify(out), cards: data.cards.length, audioCount };
  },

  /** Liest und prüft Backup-Text. Verändert noch nichts. */
  parse(text) {
    let obj;
    try { obj = JSON.parse(String(text == null ? '' : text).replace(/^﻿/, '').trim()); }
    catch (e) { return { ok: false, error: 'Das ist kein gültiges Backup (Text unvollständig oder beschädigt).' }; }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, error: 'Das ist kein gültiges Backup.' };

    let payload, createdAt = null, checksumOk = null, audio = {}, kind = 'legacy', source = 'zara-web';
    if (obj.format === this.FORMAT) {
      kind = 'zara'; payload = obj.data; createdAt = obj.createdAt || null; source = obj.source || source;
      if (obj.formatVersion > this.VERSION) return { ok: false, error: 'Dieses Backup stammt aus einer neueren ZARA-Version. Bitte ZARA aktualisieren.' };
      if (obj.checksum) {
        try { checksumOk = (checksum(JSON.stringify(payload)) === obj.checksum); } catch (e) { checksumOk = false; }
      }
      if (obj.audio && typeof obj.audio === 'object') audio = obj.audio;
    } else {
      payload = obj;      // Backup der Version 2.0: die Datenstruktur selbst
    }
    if (!payload || !Array.isArray(payload.cards)) return { ok: false, error: 'Im Backup wurden keine Karten gefunden.' };

    const { data, issues } = Schema.sanitize(payload);
    if (data.schemaVersion > SCHEMA) return { ok: false, error: 'Dieses Backup stammt aus einer neueren ZARA-Version. Bitte ZARA aktualisieren.' };
    const from = data.schemaVersion;
    if (from < SCHEMA) Schema.migrate(data);
    return { ok: true, kind, source, data, issues, createdAt, checksumOk, audio,
      migratedFrom: from < SCHEMA ? from : null,
      summary: { cards: data.cards.length, logs: data.logs.length,
        tags: new Set(data.cards.flatMap(c => c.tags)).size, audio: Object.keys(audio).length } };
  },

  /** Führt zwei Datenstände zusammen (ohne etwas zu verlieren). */
  merge(cur, inc) {
    const out = clone(cur);
    const byId = new Map(out.cards.map(c => [c.id, c]));
    const LEARN = ['state', 's', 'd', 'interval', 'reps', 'lapses', 'correct', 'wrong', 'miss', 'lastReview', 'nextReview', 'lastTime'];
    let added = 0, updated = 0;
    for (const ic of inc.cards) {
      const c = byId.get(ic.id);
      if (!c) { out.cards.push(clone(ic)); added++; continue; }
      const newerContent = (ic.updatedAt || 0) > (c.updatedAt || 0);
      const newerLearning = (ic.lastReview || 0) > (c.lastReview || 0);
      if (newerContent) { for (const k of ['de', 'fa', 'translit', 'tags', 'audio', 'active', 'fav', 'exDe', 'exFa', 'updatedAt']) c[k] = clone(ic[k]); updated++; }
      if (newerLearning) for (const k of LEARN) c[k] = ic[k];
    }
    const key = l => [l.date, l.cardId || '', l.itemId || '', l.rating, l.mode].join('|');
    const seen = new Set(out.logs.map(key));
    for (const l of inc.logs) if (!seen.has(key(l))) { out.logs.push(clone(l)); seen.add(key(l)); }
    out.logs.sort((a, b) => a.date - b.date);
    for (const [k, v] of Object.entries(inc.logArchive || {})) {
      if (!out.logArchive[k] || out.logArchive[k].n < v.n) out.logArchive[k] = clone(v);
    }
    for (const [k, v] of Object.entries(inc.sent || {})) {
      if (!out.sent[k] || (out.sent[k].last || 0) < (v.last || 0)) out.sent[k] = clone(v);
    }
    return { data: out, added, updated };
  },

  /**
   * Wendet ein geprüftes Backup an. mode: 'replace' | 'merge'.
   * Legt vorher IMMER eine Sicherheitskopie an und rollt bei Fehlern zurück.
   */
  async apply(parsed, mode = 'replace') {
    const wasRecovery = Store.mode === 'recovery';
    const before = Store.data;
    let undoId = null;
    if (!wasRecovery) {
      const rawNow = Store._get(Store.KEY);
      if (rawNow) Store._set(Store.PREV + '.prerestore', rawNow);
      const rec = await Store.snapshot('pre-restore');
      undoId = rec ? rec.id : null;
    }
    let next, extra = {};
    if (mode === 'merge' && !wasRecovery) {
      const m = this.merge(Store.data, parsed.data);
      next = m.data; extra = { added: m.added, updated: m.updated };
    } else {
      next = clone(parsed.data);
      next.settings = Schema.fixSettings(next.settings);
    }
    next.schemaVersion = SCHEMA;
    next.meta = Object.assign({}, next.meta, { restoredAt: now() });
    Store.data = next;
    Store.mode = 'ok';
    if (!Store.save()) {
      Store.data = before;            // Rollback im Speicher – Hauptdatensatz blieb unverändert
      Store.mode = wasRecovery ? 'recovery' : 'ok';
      return { ok: false, error: 'Speichern nicht möglich (Speicher voll?). Es wurde nichts verändert.' };
    }
    let audioRestored = 0;
    for (const [id, a] of Object.entries(parsed.audio || {})) {
      if (a && a.b64 && next.cards.some(c => c.id === id)) {
        try { if (await AudioStore.put(id, b64ToBlob(a.b64, a.type))) audioRestored++; } catch (e) {}
      }
    }
    Store.recovery = null;
    this.lastUndo = undoId;
    return Object.assign({ ok: true, undoId, audioRestored, cards: next.cards.length }, extra);
  },

  /** Stellt den Stand vor der letzten Wiederherstellung wieder her. */
  async undo() {
    if (!this.lastUndo) return { ok: false, error: 'Nichts zum Rückgängigmachen.' };
    const snap = await Store.getSnapshot(this.lastUndo);
    if (!snap) return { ok: false, error: 'Die Sicherheitskopie wurde nicht gefunden.' };
    const parsed = this.parse(snap.json);
    if (!parsed.ok) return parsed;
    this.lastUndo = null;
    return this.apply(parsed, 'replace');
  },

  /** Aus einem Schnappschuss wiederherstellen. */
  async restoreSnapshot(id) {
    const snap = await Store.getSnapshot(id);
    if (!snap) return { ok: false, error: 'Schnappschuss nicht gefunden.' };
    const parsed = this.parse(snap.json);
    if (!parsed.ok) return parsed;
    return this.apply(parsed, 'replace');
  },

  /** Wiederherstellungsmodus verlassen: bewusst bei null beginnen (Rohtext bleibt in der Quarantäne). */
  startFresh() {
    Store.data = emptyData();
    Store.mode = 'ok'; Store.recovery = null;
    return Store.save();
  }
};

/* ===== 50-scheduler.js ===== */
/* ============================================================
   50-scheduler: Fälligkeit, „schwierige Wörter", Warteschlangen.
   Adaptives Lernen: Je öfter ein Wort falsch war (oder je schwieriger
   FSRS es einstuft), desto früher und häufiger kommt es wieder.
   ============================================================ */

function isDue(c, t = now()) { if (!c.active) return false; if (!c.nextReview) return true; return c.nextReview <= t; }

/** 0 = sicher beherrscht … >1,2 = schwierig. Kombiniert Fehlerquote, FSRS-Schwierigkeit, Rückfälle, Spiel-Fehler, Vergessenswahrscheinlichkeit. */
function weakScore(c, t = now()) {
  const reps = c.reps || 0;
  if (!reps) return 0;
  const wrongRate = clamp((c.wrong || 0) / reps, 0, 1);
  const dNorm = (clamp(c.d || 5, 1, 10) - 1) / 9;
  const lapse = Math.min(c.lapses || 0, 5) / 5;
  const miss = Math.min(c.miss || 0, 5) / 5;
  const retr = (c.s > 0 && c.lastReview) ? FSRS.R(Math.max(t - c.lastReview, 0) / DAY, c.s) : 1;
  return wrongRate * 2 + dNorm * 1.2 + lapse + miss * 0.5 + (1 - retr) * 0.8;
}
const WEAK_THRESHOLD = 1.2;
function isWeak(c, t = now()) { return c.active && (c.reps || 0) >= 1 && weakScore(c, t) >= WEAK_THRESHOLD; }
function weakCards(cards, t = now()) {
  return cards.filter(c => isWeak(c, t)).sort((a, b) => weakScore(b, t) - weakScore(a, t));
}

/** Lern-Warteschlange: Fälligkeit dominiert, Schwierigkeit erhöht die Häufigkeit, Rauschen sorgt für Abwechslung. */
function buildQueue(cards, limit, rng = Math.random, t = now()) {
  const active = cards.filter(c => c.active);
  const due = active.filter(c => isDue(c, t));
  const pool = due.length ? due : active;
  const scored = pool.map(c => {
    const overdue = c.nextReview ? Math.max((t - c.nextReview) / DAY, 0) : 2.0;
    return { c, p: overdue * 2 + weakScore(c, t) * 0.8 + rng() };
  }).sort((a, b) => b.p - a.p).map(x => x.c);
  // Tag-Interleaving: nicht zwei Karten desselben (ersten) Tags direkt nacheinander.
  const res = []; const rem = scored.slice();
  while (rem.length) {
    const last = res.length ? (res[res.length - 1].tags[0] || null) : null;
    let i = rem.findIndex(c => (c.tags[0] || null) !== last);
    if (i < 0) i = 0;
    res.push(rem.splice(i, 1)[0]);
  }
  return limit ? res.slice(0, limit) : res;
}

/* ----- Sätze & Grammatik: einfaches Leitner-System (Kästen 0…5) ----- */
const SENT_DAYS = [0, 1, 2, 4, 8, 16];

function sentUpdate(sent, id, ok, t = now()) {
  const s = sent[id] || (sent[id] = { box: 0, due: 0, ok: 0, bad: 0, last: 0 });
  if (ok) { s.ok++; s.box = Math.min(s.box + 1, 5); } else { s.bad++; s.box = 0; }
  s.due = t + SENT_DAYS[s.box] * DAY; s.last = t;
  return s;
}

/** Wählt n Elemente: erst fällige/schwache, dann neue, dann der Rest. */
function pickItems(items, sent, n, rng = Math.random, t = now()) {
  const scored = items.map(it => {
    const s = sent[it.id];
    let p;
    if (!s) p = 1.5 + rng() * 0.5;                       // neu
    else if (s.due <= t) p = 2 + (6 - s.box) * 0.3 + (s.bad / Math.max(s.ok + s.bad, 1)) + rng() * 0.3;  // fällig
    else p = rng() * 0.4;                                 // noch nicht fällig
    return { it, p };
  });
  return scored.sort((a, b) => b.p - a.p).slice(0, n).map(x => x.it);
}

/* ===== 55-engine.js ===== */
/* ============================================================
   55-engine: Antworten verbuchen (FSRS, Verlauf, Sätze) und
   Statistik/Spielelemente berechnen. Keine DOM-Zugriffe.
   ============================================================ */

const Engine = {
  /**
   * Verbucht die Antwort auf eine Vokabelkarte.
   * opts: {mode, time, practice (nur Übung, ändert FSRS nicht), fsrs (default true)}
   */
  recordCard(card, rating, opts = {}) {
    const t = now();
    const mode = opts.mode || 'flip';
    const wasWeak = isWeak(card, t);
    const useFsrs = opts.fsrs !== false && !opts.practice;
    if (useFsrs) {
      const r = FSRS.schedule({ state: card.state, s: card.s, d: card.d, lastReview: card.lastReview }, rating, t);
      card.s = r.s; card.d = r.d; card.state = r.state; card.interval = r.interval;
      card.lastReview = t; card.nextReview = r.due; card.lastTime = opts.time || 0;
      card.reps = (card.reps || 0) + 1;
      if (rating === 1) { card.wrong = (card.wrong || 0) + 1; if (card.state === 'relearning') card.lapses = (card.lapses || 0) + 1; }
      else card.correct = (card.correct || 0) + 1;
    } else if (rating === 1) {
      card.miss = (card.miss || 0) + 1;      // Fehler in Spielen/Übungswiederholung fließt in die Schwäche-Bewertung ein
    }
    const log = { date: t, rating, time: opts.time || 0, mode, cardId: card.id };
    if (opts.practice) log.p = 1;
    if (wasWeak) log.wk = 1;
    DB.data.logs.push(log);
    return log;
  },

  /** Verbucht eine Satz-/Grammatikaufgabe. */
  recordItem(itemId, ok, opts = {}) {
    const t = now();
    if (!opts.practice) sentUpdate(DB.data.sent, itemId, ok, t);   // Übungswiederholungen ändern den Leitner-Kasten nicht
    const log = { date: t, rating: ok ? (opts.rating || 3) : 1, time: opts.time || 0, mode: opts.mode || 'sent', itemId };
    if (opts.practice) log.p = 1;
    DB.data.logs.push(log);
    return log;
  }
};

/* ---------- Statistik, Level, Erfolge ---------- */
function levelInfo(xp) {
  const level = Math.floor(Math.sqrt(Math.max(xp, 0) / 50)) + 1;
  const base = 50 * (level - 1) * (level - 1), next = 50 * level * level;
  return { level, xp, base, next, pct: Math.round((xp - base) / (next - base) * 100) };
}

function shiftDay(key, delta) {
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(y, m - 1, d + delta, 12);   // 12 Uhr: unempfindlich gegen Sommerzeit
  return dayKey(dt.getTime());
}

function computeStats(data = DB.data, t = now()) {
  const cards = data.cards, logs = data.logs, arch = data.logArchive || {};
  const total = cards.length, active = cards.filter(c => c.active).length;
  const todayKey = dayKey(t);
  const todayLogs = logs.filter(l => dayKey(l.date) === todayKey);
  const today = todayLogs.filter(l => !l.p).length;

  let n = 0, ok = 0, time = 0, xp = 0;
  const days = new Set(Object.keys(arch).filter(k => arch[k].n > 0));
  for (const [, a] of Object.entries(arch)) { n += a.n; ok += a.ok; time += a.t; xp += a.xp; }
  for (const l of logs) { n++; if (l.rating !== 1) ok++; time += l.time; xp += xpForLog(l); days.add(dayKey(l.date)); }

  let streak = 0, k = todayKey;
  if (!days.has(k)) k = shiftDay(k, -1);
  while (days.has(k)) { streak++; k = shiftDay(k, -1); }

  const perDay = [];
  for (let off = 13; off >= 0; off--) {
    const key = shiftDay(todayKey, -off);
    const fromLogs = logs.filter(l => dayKey(l.date) === key).length;
    perDay.push(fromLogs || (arch[key] ? arch[key].n : 0));
  }

  const tc = {}; cards.forEach(c => c.tags.forEach(tg => tc[tg] = (tc[tg] || 0) + 1));
  const known = { neu: 0, lernend: 0, gefestigt: 0 };
  for (const c of cards) {
    if (!c.active) continue;
    if (!c.reps) known.neu++; else if (c.s >= 21) known.gefestigt++; else known.lernend++;
  }
  const weak = weakCards(cards, t);
  const goal = (data.settings && data.settings.dailyGoal) || 20;
  const wkRight = logs.filter(l => l.wk && l.rating >= 3).length;
  return {
    total, active, inactive: total - active, today, goal, goalPct: Math.min(100, Math.round(today / goal * 100)),
    reviews: n, rate: n ? ok / n : 0, avg: n ? time / n : 0, streak, perDay, xp, level: levelInfo(xp),
    hardest: weak.slice(0, 5), weakCount: weak.length,
    topTags: Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 6),
    dueCount: cards.filter(c => isDue(c, t)).length, known, learnedCards: cards.filter(c => c.reps > 0).length, wkRight
  };
}

/* ===== 60-games.js ===== */
/* ============================================================
   60-games: Aufgaben-Generatoren (rein, ohne DOM, mit injizierbarem
   Zufall). Jede Funktion liefert alles, was die Oberfläche braucht.
   ============================================================ */

const isFaText = s => /[؀-ۿ]/.test(s || '');
const normKey = s => Answer.normalize(s, true);

/** Vorkommende Wörter der Satzbibliothek (Reserve für Ablenker bei wenigen Karten). */
function libraryWords(lang, pos) {
  const out = new Set();
  for (const s of SENTENCES) {
    const toks = lang === 'fa' ? s.faT : s.deT, ps = lang === 'fa' ? s.pf : s.pd;
    toks.forEach((t, i) => { if (!pos || pos.includes(ps[i])) out.add(t); });
  }
  return [...out];
}

/** Auswahlmöglichkeiten: richtige Antwort + bis zu n-1 Ablenker aus `pool` (ohne Duplikate/Synonyme). */
function makeChoices(correct, pool, exclude = [], n = 4, rng = Math.random) {
  const ex = new Set([correct, ...exclude].map(normKey));
  const seen = new Set();
  const dis = [];
  for (const p of shuffle(pool, rng)) {
    const k = normKey(p);
    if (!p || ex.has(k) || seen.has(k)) continue;
    seen.add(k); dis.push(p);
    if (dis.length >= n - 1) break;
  }
  const options = shuffle([correct, ...dis], rng);
  return { options, correctIdx: options.indexOf(correct) };
}

/** Multiple-Choice für eine Karte. answerIsFa: Antwort ist persisch. */
function makeCardChoices(card, answerIsFa, cards, rng = Math.random) {
  const key = answerIsFa ? 'fa' : 'de';
  const correct = card[key][0] || '';
  const tagSet = new Set(card.tags);
  const others = cards.filter(o => o.id !== card.id);
  const sameTag = shuffle(others.filter(o => o.tags.some(t => tagSet.has(t))), rng);
  const rest = shuffle(others.filter(o => !o.tags.some(t => tagSet.has(t))), rng);
  let pool = sameTag.concat(rest).map(o => o[key][0]).filter(Boolean);
  const exclude = card[key];
  const base = makeChoices(correct, pool, exclude, 4, rng);
  if (base.options.length < 4) {      // zu wenige Karten: Reserve aus der Satzbibliothek
    return makeChoices(correct, pool.concat(libraryWords(key, 'N')), exclude, 4, rng);
  }
  return base;
}

/** Zuordnungsspiel: wählt n Karten mit eindeutigen Wörtern. */
function makeMatchRound(candidates, n = 5) {
  const picked = [], sd = new Set(), sf = new Set();
  for (const c of candidates) {
    const de = c.de[0], fa = c.fa[0];
    if (!de || !fa) continue;
    const kd = Answer.normalize(de, false), kf = normKey(fa);
    if (sd.has(kd) || sf.has(kf)) continue;
    sd.add(kd); sf.add(kf); picked.push(c);
    if (picked.length >= n) break;
  }
  return picked;
}

/** Fügt die Groß-/Kleinschreibung des ersten Buchstabens von `ref` auf `tok` an. */
function matchCase(tok, ref) {
  if (!tok || !ref) return tok;
  const up = ref[0] !== ref[0].toLowerCase();
  return (up ? tok[0].toUpperCase() : tok[0].toLowerCase()) + tok.slice(1);
}

/** Lückentext. lang: Sprache des Satzes mit Lücke ('fa'|'de'). */
function makeCloze(sent, lang, rng = Math.random, library = SENTENCES) {
  const toks = lang === 'fa' ? sent.faT : sent.deT;
  const pos = lang === 'fa' ? sent.pf : sent.pd;
  let allowed = (lang === 'fa' ? sent.bf : sent.bd);
  if (!allowed) allowed = toks.map((_, i) => i).filter(i => BLANK_POS.includes(pos[i]));
  const idx = allowed[Math.floor(rng() * allowed.length)];
  const answer = toks[idx];
  const wantPos = pos[idx];
  const fromSame = [], fromAny = [];
  for (const o of library) {
    if (o.id === sent.id) continue;
    const ot = lang === 'fa' ? o.faT : o.deT, op = lang === 'fa' ? o.pf : o.pd;
    ot.forEach((t, i) => {
      if (!BLANK_POS.includes(op[i])) return;
      const cand = lang === 'de' ? matchCase(t, answer) : t;
      (op[i] === wantPos ? fromSame : fromAny).push(cand);
    });
  }
  let ch = makeChoices(answer, fromSame, [], 4, rng);
  if (ch.options.length < 4) ch = makeChoices(answer, fromSame.concat(fromAny), [], 4, rng);
  return {
    sentId: sent.id, lang, idx, answer,
    tokens: toks.map((t, i) => i === idx ? null : t),
    options: ch.options, correctIdx: ch.correctIdx,
    hint: lang === 'fa' ? sent.de : sent.fa, hintIsFa: lang !== 'fa',
    full: lang === 'fa' ? sent.fa : sent.de, tr: sent.tr, end: lang === 'fa' ? (sent.q ? '؟' : '.') : (sent.q ? '?' : '.')
  };
}

/** Satzbildung: Wörter in die richtige Reihenfolge bringen. dir: 'g2p' (→ Persisch) | 'p2g' (→ Deutsch). */
function makeBuild(sent, dir, rng = Math.random) {
  const toFa = dir === 'g2p';
  const solution = toFa ? sent.faT : sent.deT;
  const items = solution.map((t, i) => ({ id: i, t }));
  let sh = shuffle(items, rng);
  if (solution.length > 1 && sh.every((x, i) => x.id === i)) sh = sh.slice().reverse();
  return {
    sentId: sent.id, dir, tokens: sh, solution,
    alts: toFa ? sent.alts.map(a => a.split(' ')) : [],
    prompt: toFa ? sent.de : sent.fa, promptIsFa: !toFa, answerIsFa: toFa,
    full: toFa ? sent.fa : sent.de, tr: sent.tr, end: toFa ? (sent.q ? '؟' : '.') : (sent.q ? '?' : '.')
  };
}
function checkBuild(b, chosen) {
  const norm = a => a.map(t => Answer.normalize(t, b.answerIsFa)).join(' ');
  const c = norm(chosen);
  return [b.solution, ...b.alts].some(s => norm(s) === c);
}

/** Übersetzungsübung (Tippen). */
function makeTranslate(sent, dir) {
  const toFa = dir === 'g2p';
  return {
    sentId: sent.id, dir, prompt: toFa ? sent.de : sent.fa, promptIsFa: !toFa, answerIsFa: toFa,
    solutions: [toFa ? sent.fa : sent.de, ...(toFa ? sent.alts.map(a => a + (sent.q ? '؟' : '.')) : [])],
    tr: sent.tr
  };
}

/** Grammatikfrage mit gemischten Antworten. */
function makeGrammar(item, rng = Math.random) {
  const options = shuffle(item.a, rng);
  return { itemId: item.id, lang: item.lang, topic: item.topic, q: item.q, options,
    correctIdx: options.indexOf(item.a[0]), e: item.e, x: item.x || '' };
}

/** Hörverständnis. spoken: 'de' (Deutsch hören, Persisch wählen) | 'fa' (Persisch hören, Deutsch wählen). */
function makeListen(card, spoken, cards, rng = Math.random) {
  const answerIsFa = spoken === 'de';
  const speakText = spoken === 'fa' ? card.fa[0] : card.de[0];
  const ch = makeCardChoices(card, answerIsFa, cards, rng);
  return { cardId: card.id, spoken, speakText, options: ch.options, correctIdx: ch.correctIdx, answerIsFa };
}

/* ---------- Aufgabenfolgen ("Pläne") ---------- */
function resolveDir(direction, rng = Math.random) {
  return direction === 'mixed' ? (rng() < 0.5 ? 'g2p' : 'p2g') : direction;
}

/** Vokabel-Lektion (Umdrehen / Multiple Choice / Schreiben). */
function planVocab(cards, { mode, direction, limit, weak = false }, rng = Math.random) {
  const queue = buildQueue(cards, limit, rng);
  return queue.map(c => ({ type: mode, cardId: c.id, dir: resolveDir(direction, rng), weak: weak || isWeak(c) }));
}

/** Schwierige Wörter üben: nur schwache Karten, abwechselnd Auswahl und Schreiben. */
function planWeak(cards, { direction, limit = 12 }, rng = Math.random) {
  const list = weakCards(cards).slice(0, limit);
  const useMc = cards.length >= 4;
  return list.map((c, i) => ({ type: (useMc && i % 2 === 0) ? 'mc' : 'write', cardId: c.id, dir: resolveDir(direction, rng), weak: true }));
}

/** Kandidaten für Zuordnung/Hören: schwache zuerst, dann fällige, dann der Rest (jeweils gemischt). */
function gameCandidates(cards, rng = Math.random) {
  const active = cards.filter(c => c.active);
  const w = shuffle(weakCards(active), rng);
  const d = shuffle(active.filter(c => isDue(c) && !w.includes(c)), rng);
  const rest = shuffle(active.filter(c => !w.includes(c) && !d.includes(c)), rng);
  return w.concat(d, rest);
}

function planMatch(cards, rounds = 3, rng = Math.random, direction = 'g2p') {
  const steps = [];
  let pool = gameCandidates(cards, rng);
  for (let r = 0; r < rounds; r++) {
    const pick = makeMatchRound(pool, 5);
    if (pick.length < 3) break;
    steps.push({ type: 'match', dir: resolveDir(direction, rng), cardIds: pick.map(c => c.id), left: shuffle(pick.map(c => c.id), rng), right: shuffle(pick.map(c => c.id), rng) });
    pool = pool.filter(c => !pick.includes(c)).concat(pick);   // verbrauchte Karten ans Ende
  }
  return steps;
}

function planListen(cards, { direction, count = 10, canSpeakFa, canSpeakDe }, rng = Math.random) {
  const out = [];
  for (const c of gameCandidates(cards, rng)) {
    if (out.length >= count) break;
    let spoken = direction === 'g2p' ? 'de' : direction === 'p2g' ? 'fa' : (rng() < 0.5 ? 'de' : 'fa');
    const okFa = canSpeakFa || c.audio, okDe = canSpeakDe;
    if (spoken === 'fa' && !okFa) spoken = 'de';
    if (spoken === 'de' && !okDe) { if (okFa) spoken = 'fa'; else continue; }
    out.push({ type: 'listen', cardId: c.id, spoken });
  }
  return out;
}

function planSentences(type, sent, { count = 8, direction = 'mixed', lang = null }, rng = Math.random) {
  const picked = pickItems(SENTENCES, sent, count, rng);
  return picked.map(s => {
    const dir = resolveDir(direction, rng);
    const step = { type, sentId: s.id, dir };
    if (type === 'cloze') step.lang = lang || (dir === 'g2p' ? 'fa' : 'de');
    return step;
  });
}

function planGrammar(sent, { lang, topic = null, count = 10 }, rng = Math.random) {
  const pool = GRAMMAR.filter(g => g.lang === lang && (!topic || g.topic === topic));
  return pickItems(pool, sent, count, rng).map(g => ({ type: 'grammar', itemId: g.id }));
}

function planSpeak(cards, count = 8, rng = Math.random) {
  return gameCandidates(cards, rng).slice(0, count).map(c => ({ type: 'speak', cardId: c.id }));
}

/** „5-Minuten-Spiel": abwechslungsreiche Mischung (~12 Aufgaben). */
function planMix(data, { direction, canSpeakFa, canSpeakDe }, rng = Math.random) {
  const cards = data.cards.filter(c => c.active);
  const steps = [];
  if (cards.length >= 3) steps.push(...planMatch(cards, 1, rng, direction));
  const vocab = gameCandidates(cards, rng).slice(0, 6);
  vocab.forEach((c, i) => {
    const dir = resolveDir(direction, rng);
    steps.push({ type: i % 3 === 2 ? 'write' : 'mc', cardId: c.id, dir, weak: isWeak(c) });
  });
  steps.push(...planListen(cards, { direction, count: 2, canSpeakFa, canSpeakDe }, rng));
  steps.push(...planCloze(data, { count: 2, direction }, rng));
  steps.push(...planSentences('build', data.sent, { count: 1, direction }, rng));
  steps.push(...planGrammar(data.sent, { lang: 'fa', count: 2 }, rng));
  return steps;
}

/** Nach einem Fehler: dieselbe Aufgabe wenige Positionen später als Übung wiederholen. */
function requeueStep(steps, index, gap = 3) {
  const step = Object.assign({}, steps[index], { practice: true, retry: true });
  const at = Math.min(index + 1 + gap, steps.length);
  steps.splice(at, 0, step);
  return step;
}

/* ---------- Lückentext aus eigenen Karten (Beispielsatz auf der Karte) ---------- */
const EDGE_PUNCT = /^[\s.,;:!?…«»()"'،؛؟]+|[\s.,;:!?…«»()"'،؛؟]+$/g;

/** Persischer Beispielsatz der Karte mit Lücke beim Kartenwort; null, wenn das Wort im Satz nicht vorkommt. */
function makeCardCloze(card, cards, rng = Math.random) {
  if (!card.exFa || !card.exFa.trim()) return null;
  const toks = card.exFa.trim().split(/\s+/);
  const keys = card.fa.map(normKey);
  const idx = toks.findIndex(t => keys.includes(normKey(t)));
  if (idx < 0) return null;
  const raw = toks[idx], answer = raw.replace(EDGE_PUNCT, '');
  const trail = raw.slice(raw.indexOf(answer) + answer.length);
  const pool = cards.filter(o => o.id !== card.id).map(o => o.fa[0]).filter(Boolean);
  let ch = makeChoices(answer, pool, card.fa, 4, rng);
  if (ch.options.length < 4) ch = makeChoices(answer, pool.concat(libraryWords('fa', 'N')), card.fa, 4, rng);
  return {
    sentId: null, cardId: card.id, lang: 'fa', idx, answer, trail,
    tokens: toks.map((t, i) => i === idx ? null : t),
    options: ch.options, correctIdx: ch.correctIdx,
    hint: card.exDe || card.de[0], hintIsFa: false, full: card.exFa, tr: '', end: ''
  };
}

/** Lückentext-Folge: bis zu 1/3 aus eigenen Beispielsätzen, Rest aus der Satzbibliothek. */
function planCloze(data, { count = 10, direction = 'mixed' }, rng = Math.random) {
  const mine = shuffle(data.cards.filter(c => c.active && c.exFa && makeCardCloze(c, data.cards, rng)), rng)
    .slice(0, Math.floor(count / 3)).map(c => ({ type: 'ccloze', cardId: c.id, lang: 'fa' }));
  const lib = planSentences('cloze', data.sent, { count: count - mine.length, direction }, rng);
  return shuffle(lib.concat(mine), rng);
}

/* ===== 70-media.js ===== */
/* ============================================================
   70-media: Sprachausgabe (TTS), Wiedergabe eigener Aufnahmen,
   Aufnahme, Haptik. Alles per Funktionserkennung – fehlt etwas
   (z. B. persische Stimme), blendet die Oberfläche es sauber aus.
   ============================================================ */

const Speech = {
  voices: [],
  init() {
    try {
      if (typeof speechSynthesis === 'undefined') return;
      const load = () => { this.voices = speechSynthesis.getVoices() || []; };
      load();
      speechSynthesis.onvoiceschanged = load;
    } catch (e) {}
  },
  voiceFor(lang) {
    return this.voices.find(v => {
      const vl = String(v.lang || '').toLowerCase().replace('_', '-');
      return lang === 'fa' ? (vl.startsWith('fa') || vl.startsWith('prs')) : vl.startsWith('de');
    }) || null;
  },
  can(lang) { return !!this.voiceFor(lang); },
  speak(text, lang) {
    return new Promise(res => {
      const v = this.voiceFor(lang);
      if (!v || !text) return res(false);
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.voice = v; u.lang = v.lang; u.rate = 0.85;
        u.onend = () => res(true); u.onerror = () => res(false);
        speechSynthesis.speak(u);
      } catch (e) { res(false); }
    });
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} }
};

const Player = {
  _a: null,
  async playBlob(blob) {
    if (!blob) return false;
    try {
      if (this._a) { this._a.pause(); }
      const url = URL.createObjectURL(blob);
      const a = new Audio(url); this._a = a;
      a.onended = () => URL.revokeObjectURL(url);
      await a.play();
      return true;
    } catch (e) { return false; }
  },
  async playCard(id) { return this.playBlob(await AudioStore.get(id)); },
  /** Referenz-Aussprache: eigene Aufnahme bevorzugt (Persisch), sonst Sprachausgabe. */
  async playRef(card, lang) {
    if (lang === 'fa' && card.audio && await this.playCard(card.id)) return true;
    return Speech.speak(lang === 'fa' ? card.fa[0] : card.de[0], lang);
  }
};

const Recorder = {
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== 'undefined'); },
  _mr: null, _chunks: [], _stream: null,
  async start() {
    this._stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this._chunks = [];
    this._mr = new MediaRecorder(this._stream);
    this._mr.ondataavailable = e => { if (e.data && e.data.size) this._chunks.push(e.data); };
    this._mr.start();
  },
  stop() {
    return new Promise(res => {
      const mr = this._mr;
      if (!mr || mr.state !== 'recording') return res(null);
      mr.onstop = () => {
        const blob = new Blob(this._chunks, { type: (this._chunks[0] && this._chunks[0].type) || 'audio/mp4' });
        if (this._stream) this._stream.getTracks().forEach(t => t.stop());
        this._mr = null; this._stream = null;
        res(blob);
      };
      mr.stop();
    });
  },
  active() { return !!(this._mr && this._mr.state === 'recording'); },
  abort() {
    try { if (this._mr && this._mr.state === 'recording') { this._mr.onstop = null; this._mr.stop(); } } catch (e) {}
    try { if (this._stream) this._stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    this._mr = null; this._stream = null;
  },
  errorMessage(e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') return 'Mikrofon nicht erlaubt – bitte in den iPhone-Einstellungen freigeben.';
    if (n === 'NotFoundError') return 'Kein Mikrofon gefunden.';
    return 'Aufnahme nicht möglich.';
  }
};

/** Kurzes Vibrationsfeedback (wo vom Browser unterstützt, z. B. nicht auf iOS-Safari). */
function buzz(p) {
  try {
    if (DB.data.settings.haptics === false) return;
    if (navigator.vibrate) navigator.vibrate(p);
  } catch (e) {}
}

});

    if (!el) return;
    timer = setTimeout(() => { fired = true; const fn = A[el.dataset.lp]; if (fn) try { fn(el.dataset.v, el, e); } catch (err) { reportError(err); } }, 550);
  });
  ['pointerup', 'pointercancel', 'pointermove', 'scroll'].forEach(ev => document.addEventListener(ev, () => clearTimeout(timer), true));
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-lp]')) e.preventDefault(); });
  document.addEventListener('click', e => { if (fired && e.target.closest('[data-lp]')) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
})();

let CardSearch = '';
function searchNorm(s, fa) { return Answer.normalize(s || '', fa).replace(/\s+/g, ''); }
function cardMatches(c, q) {
  const qn = searchNorm(q, false), qf = searchNorm(q, true);
  if (!qn && !qf) return true;
  return searchNorm(c.de.join(' '), false).includes(qn) || c.fa.map(x => searchNorm(x, true)).join('').includes(qf)
    || searchNorm(c.translit || '', false).includes(qn);
}
function filteredCards() {
  const q = CardSearch.trim();
  const list = DB.data.cards.slice().sort((a, b) => b.updatedAt - a.updatedAt);
  return q ? list.filter(c => cardMatches(c, q)) : list;
}
