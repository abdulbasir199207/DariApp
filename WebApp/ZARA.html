/* ===== 82-ui-session.js ===== */
/* ============================================================
   82-ui-session: Ablauf einer Übungseinheit und die Ansichten aller
   Aufgabentypen (Umdrehen, Auswahl, Schreiben, Hören, Zuordnung,
   Lückentext, Satzbildung, Übersetzen, Grammatik, Aussprache).
   ============================================================ */

const FAST = { mc: 4, write: 5, listen: 5 };    // Sekunden für „Leicht"
const curDir = () => LearnCfg.direction || DB.data.settings.defaultDirection;
const curMode = () => LearnCfg.mode || DB.data.settings.defaultMode;
const speechCaps = () => ({ canSpeakFa: Speech.can('fa'), canSpeakDe: Speech.can('de') });

const Session = {
  s: null,
  ss: null,

  start({ title, steps, again }) {
    if (!steps || !steps.length) { toast('Dafür gibt es gerade nichts zu üben.'); return false; }
    const st0 = computeStats();
    this.s = { title, steps, i: 0, answered: 0, correct: 0, xp: 0, weakFixed: 0, again, done: false,
      xp0: st0.xp, ach0: new Set(ACHIEVEMENTS.filter(a => a.test(st0)).map(a => a.id)) };
    App.session = true; App.sub = null;
    this.prepare();
    render();
    return true;
  },
  abort() {
    if (Recorder.active()) Recorder.abort();
    Speech.stop();
    this.s = null; this.ss = null; App.session = false;
  },
  step() { return this.s.steps[this.s.i]; },

  /* ----- Vorbereitung je Aufgabe ----- */
  prepare() {
    const step = this.step(), cards = DB.data.cards;
    const ss = this.ss = { t0: now(), selected: null, quality: null, val: '' };
    const card = step.cardId ? cardById(step.cardId) : null;
    if (step.cardId && !card) { return this.advance(); }
    switch (step.type) {
      case 'flip': ss.flipped = false; ss.revealed = false; break;
      case 'mc': ss.ch = makeCardChoices(card, step.dir === 'g2p', cards.filter(c => c.active || c.id === card.id)); break;
      case 'write': break;
      case 'listen': ss.data = makeListen(card, step.spoken, cards.filter(c => c.active)); ss.played = false; break;
      case 'match': ss.sel = null; ss.done = new Set(); ss.mistakes = {}; ss.errors = 0; ss.finished = false; ss.shake = null; break;
      case 'cloze': ss.c = makeCloze(SENTENCES.find(x => x.id === step.sentId), step.lang); break;
      case 'ccloze': ss.c = makeCardCloze(card, cards.filter(c => c.active || c.id === card.id)); if (!ss.c) return this.advance(); break;
      case 'build': ss.b = makeBuild(SENTENCES.find(x => x.id === step.sentId), step.dir); ss.placed = []; ss.result = null; break;
      case 'translate': ss.t = makeTranslate(SENTENCES.find(x => x.id === step.sentId), step.dir); break;
      case 'grammar': ss.q = makeGrammar(GRAMMAR.find(x => x.id === step.itemId)); break;
      case 'speak': ss.phase = 'start'; ss.userBlob = null; ss.recording = false; ss.rated = false; break;
    }
  },
  advance() {
    const s = this.s;
    Speech.stop();
    s.i++;
    if (s.i >= s.steps.length) { s.done = true; s.i = s.steps.length; this.ss = null; }
    else this.prepare();
  },

  /* ----- Verbuchen ----- */
  tally(log, rating) {
    const s = this.s;
    s.answered++; if (rating > 1) s.correct++;
    s.xp += xpForLog(log);
    if (log.wk && rating >= 3) s.weakFixed++;
  },
  seconds() { return (now() - this.ss.t0) / 1000; },
  cardResult(step, rating, opts = {}) {
    const card = cardById(step.cardId); if (!card) return;
    const log = Engine.recordCard(card, rating, { mode: opts.mode || step.type, time: this.seconds(), practice: step.practice, fsrs: opts.fsrs });
    this.tally(log, rating);
    if (rating === 1 && !step.practice && !opts.noRequeue) requeueStep(this.s.steps, this.s.i);
    DB.save();
  },
  itemResult(step, ok, rating) {
    const log = Engine.recordItem(step.sentId || step.itemId, ok, { mode: step.type, time: this.seconds(), practice: step.practice, rating });
    this.tally(log, ok ? rating : 1);
    if (!ok && !step.practice) requeueStep(this.s.steps, this.s.i);
    DB.save();
  },

  /* ----- Interaktion ----- */
  pick(i) {
    const step = this.step(), ss = this.ss;
    if (ss.selected != null) return;
    ss.selected = i;
    if (step.type === 'mc') {
      const ok = i === ss.ch.correctIdx; ss.quality = ok ? 'perfect' : 'wrong';
      this.cardResult(step, ratingFromQuality(ss.quality, this.seconds() < FAST.mc));
    } else if (step.type === 'listen') {
      const ok = i === ss.data.correctIdx; ss.quality = ok ? 'perfect' : 'wrong';
      this.cardResult(step, ratingFromQuality(ss.quality, this.seconds() < FAST.listen));
    } else if (step.type === 'cloze') {
      const ok = i === ss.c.correctIdx; ss.quality = ok ? 'perfect' : 'wrong';
      this.itemResult(step, ok, 3);
    } else if (step.type === 'ccloze') {
      const ok = i === ss.c.correctIdx; ss.quality = ok ? 'perfect' : 'wrong';
      this.cardResult(step, ratingFromQuality(ss.quality, this.seconds() < FAST.mc));
    } else if (step.type === 'grammar') {
      const ok = i === ss.q.correctIdx; ss.quality = ok ? 'perfect' : 'wrong';
      this.itemResult(step, ok, 3);
    }
    buzz(ss.quality === 'perfect' ? 10 : [40, 30, 40]);
    render();
  },
  flip() { const ss = this.ss; ss.flipped = !ss.flipped; ss.revealed = true; buzz(10); render(); },
  rate(g) { const step = this.step(); buzz(10); this.cardResult(step, g); this.advance(); render(); },
  check() {
    const step = this.step(), ss = this.ss;
    if (ss.quality) return;
    const el = $('writeInput'), val = (el ? el.value : ss.val).trim();
    if (!val) return;
    ss.val = val;
    if (step.type === 'write') {
      const card = cardById(step.cardId), fa = step.dir === 'g2p';
      ss.quality = Answer.evaluate(val, fa ? card.fa : card.de, fa);
      this.cardResult(step, ratingFromQuality(ss.quality, this.seconds() < FAST.write));
    } else if (step.type === 'translate') {
      ss.quality = Answer.evaluateSentence(val, ss.t.solutions, ss.t.answerIsFa);
      this.itemResult(step, ss.quality !== 'wrong', ss.quality === 'typo' ? 2 : 3);
    }
    buzz(ss.quality === 'perfect' ? 10 : ss.quality === 'typo' ? 30 : [40, 30, 40]);
    render();
  },
  next() { this.advance(); render(); },

  place(i) { const ss = this.ss; if (ss.result || ss.placed.includes(i)) return; ss.placed.push(i); render(); },
  unplace(i) { const ss = this.ss; if (ss.result) return; ss.placed = ss.placed.filter(x => x !== i); render(); },
  resetBuild() { const ss = this.ss; if (ss.result) return; ss.placed = []; render(); },
  checkBuild() {
    const step = this.step(), ss = this.ss;
    if (ss.result || ss.placed.length !== ss.b.tokens.length) return;
    const ok = checkBuild(ss.b, ss.placed.map(i => ss.b.tokens[i].t));
    ss.result = ok ? 'right' : 'wrong'; ss.quality = ok ? 'perfect' : 'wrong';
    this.itemResult(step, ok, 3);
    buzz(ok ? 10 : [40, 30, 40]); render();
  },

  mpick(v) {
    const ss = this.ss, step = this.step();
    if (ss.finished) return;
    const side = v[0], id = v.slice(2);
    if (ss.done.has(id)) return;
    if (!ss.sel || ss.sel.side === side) { ss.sel = { side, id }; return render(); }
    const a = ss.sel; ss.sel = null;
    const l = a.side === 'L' ? a.id : id, r = a.side === 'L' ? id : a.id;
    if (l === r) {
      ss.done.add(l); buzz(10);
      if (ss.done.size === step.cardIds.length) this.finishMatch();
    } else {
      ss.mistakes[l] = (ss.mistakes[l] || 0) + 1; ss.mistakes[r] = (ss.mistakes[r] || 0) + 1; ss.errors++;
      ss.shake = { l, r }; buzz([40, 30, 40]);
      const key = this.s.i, self = this;
      setTimeout(() => { if (self.s && self.s.i === key && self.ss === ss) { ss.shake = null; render(); } }, 420);
    }
    render();
  },
  finishMatch() {
    const step = this.step(), ss = this.ss;
    ss.finished = true;
    const per = this.seconds() / step.cardIds.length;
    for (const id of step.cardIds) {
      const card = cardById(id); if (!card) continue;
      const rating = ss.mistakes[id] ? 1 : 3;
      const log = Engine.recordCard(card, rating, { mode: 'match', time: per, fsrs: false });
      this.tally(log, rating);
    }
    DB.save();
  },

  /* Aussprache */
  async speakRef() {
    const step = this.step(), card = cardById(step.cardId);
    const ok = await Player.playRef(card, 'fa') || await Player.playRef(card, 'de');
    if (!ok) toast('Keine Sprachausgabe oder Aufnahme vorhanden.');
  },
  async recToggle() {
    const ss = this.ss;
    if (Recorder.active()) {
      ss.userBlob = await Recorder.stop(); ss.recording = false; ss.phase = 'rec'; render(); return;
    }
    try { await Recorder.start(); ss.recording = true; render(); }
    catch (e) { toast(Recorder.errorMessage(e), 3500); }
  },
  async playMine() { if (!(await Player.playBlob(this.ss.userBlob))) toast('Wiedergabe nicht möglich.'); },
  speakRate(g) {
    const step = this.step();
    this.cardResult(step, g, { mode: 'speak', fsrs: false, noRequeue: true });
    this.advance(); render();
  },

  /* ================= Ansichten ================= */
  head() {
    const s = this.s, step = s.i < s.steps.length ? this.step() : null;
    return `<div class="row" style="margin-bottom:8px"><button class="chip" data-a="endSession">✕ Beenden</button><span class="muted small">${Math.min(s.i + 1, s.steps.length)} / ${s.steps.length}</span></div>
      <div class="progress"><div style="width:${s.i / s.steps.length * 100}%"></div></div>
      ${step && step.retry ? '<div class="langbadge">Noch einmal üben</div>' : ''}`;
  },
  nextBtn(label = 'Weiter') { return `<div style="margin-top:14px"><button class="pillbtn" data-a="sNext">${label}</button></div>`; },

  view() {
    const s = this.s;
    if (!s) return '';
    if (s.done) return this.summary();
    const step = this.step();
    const fn = this['v_' + step.type];
    const body = fn ? fn.call(this, step, this.ss) : '';
    return this.head() + body;
  },
  afterRender() {
    const s = this.s; if (!s || s.done) return;
    const step = this.step(), ss = this.ss;
    const input = $('writeInput');
    if (input && !ss.quality) { try { input.focus({ preventScroll: true }); } catch (e) {} }
    if (step.type === 'listen' && ss && !ss.played) { ss.played = true; this.listenPlay(); }
  },

  /* ----- Umdrehen ----- */
  v_flip(step, ss) {
    const card = cardById(step.cardId), g2p = step.dir === 'g2p';
    const front = !ss.flipped;
    const promptFa = !g2p, ansFa = g2p;
    const prompt = promptFa ? card.fa[0] : card.de[0], answer = ansFa ? card.fa[0] : card.de[0];
    const lang = ansFa ? 'fa' : 'de';
    const canPlay = (lang === 'fa' && card.audio) || Speech.can(lang);
    const inner = front
      ? `<div class="term-big ${promptFa ? 'fa persian' : ''}">${esc(prompt) || '—'}</div>${!ss.revealed ? '<div class="muted small" style="margin-top:8px">Zum Umdrehen tippen</div>' : ''}`
      : `<div class="term-big ${ansFa ? 'fa persian' : ''}">${esc(answer) || '—'}</div>
         ${card.translit ? `<div class="translit">${esc(card.translit)}</div>` : ''}
         ${canPlay ? `<button class="audiobtn" data-a="playRef" data-v="${lang}" aria-label="Anhören">◉</button>` : ''}`;
    const rating = ss.revealed ? `<div class="rating fadein">
        <button style="background:var(--terra)" data-a="rate" data-v="1">Nochmal</button>
        <button style="background:var(--warn)" data-a="rate" data-v="2">Schwer</button>
        <button style="background:var(--sage)" data-a="rate" data-v="3">Gut</button>
        <button style="background:var(--turq)" data-a="rate" data-v="4">Leicht</button></div>` : '';
    return `<div class="flip fadein"><div class="flip-face" data-a="flip" role="button">${inner}</div></div>${rating}`;
  },

  /* ----- Multiple Choice ----- */
  v_mc(step, ss) {
    const card = cardById(step.cardId), g2p = step.dir === 'g2p', ansFa = g2p;
    const promptFa = !g2p, prompt = promptFa ? card.fa[0] : card.de[0];
    const opts = ss.ch.options.map((o, i) => {
      let cls = 'choice';
      if (ss.selected != null) { if (i === ss.ch.correctIdx) cls += ' correct'; else if (i === ss.selected) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls} ${ansFa ? 'persian' : ''}" data-a="pick" data-v="${i}" ${ss.selected != null ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('');
    return `<div class="flip-face fadein" style="min-height:130px"><div class="term-big ${promptFa ? 'fa persian' : ''}">${esc(prompt)}</div></div>
      <div style="margin-top:18px">${opts}</div>${ss.selected != null ? this.nextBtn() : ''}`;
  },

  /* ----- Schreiben ----- */
  v_write(step, ss) {
    const card = cardById(step.cardId), g2p = step.dir === 'g2p', fa = g2p;
    const promptFa = !g2p, prompt = promptFa ? card.fa[0] : card.de[0], answer = fa ? card.fa[0] : card.de[0];
    return `<div class="flip-face fadein" style="min-height:110px"><div class="term-big ${promptFa ? 'fa persian' : ''}">${esc(prompt)}</div></div>
      <div style="margin-top:18px">${this.inputHTML(ss, fa)}</div>
      ${this.feedbackHTML(ss, { answer, answerFa: fa })}`;
  },
  inputHTML(ss, fa) {
    return ss.quality
      ? `<div class="field ${fa ? 'persian' : ''}" style="text-align:center;opacity:.7">${esc(ss.val)}</div>`
      : `<input id="writeInput" class="field ${fa ? 'persian' : ''}" style="text-align:center;font-size:20px" placeholder="${fa ? 'پاسخ فارسی' : 'Antwort'}" ${fa ? 'lang="fa" dir="rtl"' : 'lang="de"'} autocapitalize="${fa ? 'none' : 'sentences'}" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${esc(ss.val)}" data-enter="sCheck">`;
  },
  feedbackHTML(ss, { answer, answerFa, full, tr }) {
    if (!ss.quality) return `<div style="margin-top:14px"><button class="pillbtn" data-a="sCheck">Prüfen</button></div>`;
    const map = { perfect: ['ok', 'Perfekt!'], typo: ['typo', 'Fast – kleiner Tippfehler'], wrong: ['bad', 'Leider falsch'] };
    const [cls, msg] = map[ss.quality];
    return `<div class="feedback-box"><div class="${cls}">${msg}</div>
      ${ss.quality !== 'perfect' ? `<div class="muted" style="margin-top:6px">Richtig: <span class="${answerFa ? 'persian' : ''}" dir="auto">${esc(answer)}</span></div>` : ''}
      ${full ? `<div class="full ${answerFa ? 'fa persian' : ''}">${esc(full)}</div>` : ''}
      ${tr ? `<div class="translit" style="margin-top:4px">${esc(tr)}</div>` : ''}</div>${this.nextBtn()}`;
  },

  /* ----- Hören ----- */
  async listenPlay() {
    const step = this.step(), ss = this.ss, card = cardById(step.cardId);
    const ok = await Player.playRef(card, ss.data.spoken);
    if (!ok) toast('Wiedergabe nicht möglich.');
  },
  v_listen(step, ss) {
    const d = ss.data, card = cardById(step.cardId);
    const opts = d.options.map((o, i) => {
      let cls = 'choice';
      if (ss.selected != null) { if (i === d.correctIdx) cls += ' correct'; else if (i === ss.selected) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls} ${d.answerIsFa ? 'persian' : ''}" data-a="pick" data-v="${i}" ${ss.selected != null ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('');
    const reveal = ss.selected != null
      ? `<div class="feedback-box"><div class="${ss.quality === 'perfect' ? 'ok' : 'bad'}">${ss.quality === 'perfect' ? 'Richtig!' : 'Leider falsch'}</div>
         <div class="full ${d.spoken === 'fa' ? 'fa persian' : ''}">${esc(d.speakText)}</div>${card.translit && d.spoken === 'fa' ? `<div class="translit">${esc(card.translit)}</div>` : ''}</div>${this.nextBtn()}` : '';
    return `<div class="langbadge">${d.spoken === 'fa' ? 'Persisch hören → Deutsch wählen' : 'Deutsch hören → Persisch wählen'}</div>
      <button class="speakbtn" data-a="listenAgain" aria-label="Noch einmal abspielen">▶</button>
      <div class="pill-note" style="margin:0 0 14px">Tippe zum erneuten Abspielen</div>
      <div>${opts}</div>${reveal}`;
  },

  /* ----- Zuordnung ----- */
  v_match(step, ss) {
    const g2p = step.dir === 'g2p';
    const text = (id, side) => { const c = cardById(id); const fa = (side === 'L') ? !g2p : g2p; return { t: fa ? c.fa[0] : c.de[0], fa }; };
    const col = (ids, side) => ids.map(id => {
      const { t, fa } = text(id, side);
      let cls = 'mbtn' + (fa ? ' fa persian' : '');
      if (ss.done.has(id)) cls += ' done';
      else if (ss.sel && ss.sel.side === side && ss.sel.id === id) cls += ' sel';
      if (ss.shake && ((side === 'L' && ss.shake.l === id) || (side === 'R' && ss.shake.r === id))) cls += ' shake';
      return `<button class="${cls}" data-a="mpick" data-v="${side}:${esc(id)}">${esc(t)}</button>`;
    }).join('');
    const sum = ss.finished ? `<div class="feedback-box"><div class="${ss.errors ? 'typo' : 'ok'}">${ss.errors ? ss.errors + (ss.errors === 1 ? ' Fehlversuch' : ' Fehlversuche') : 'Fehlerfrei!'}</div>
        <div class="muted small" style="margin-top:4px">Falsch zugeordnete Wörter kommen bald wieder dran.</div></div>${this.nextBtn()}` : '';
    return `<div class="langbadge">Tippe zwei Wörter an, die zusammengehören</div>
      <div class="matchgrid"><div class="matchcol">${col(step.left, 'L')}</div><div class="matchcol">${col(step.right, 'R')}</div></div>${sum}`;
  },

  /* ----- Lückentext ----- */
  v_ccloze(step, ss) { return this.v_cloze(step, ss); },
  v_cloze(step, ss) {
    const c = ss.c, fa = c.lang === 'fa', answered = ss.selected != null;
    const toks = c.tokens.map((t, i) => {
      if (t != null) return `<span>${esc(t)}</span>`;
      const gap = answered ? `<span class="gap ${ss.quality === 'perfect' ? 'filled' : 'bad'}">${esc(ss.quality === 'perfect' ? c.answer : c.options[ss.selected])}</span>` : '<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>';
      return gap + (c.trail ? `<span>${esc(c.trail)}</span>` : '');
    }).join('');
    const opts = c.options.map((o, i) => {
      let cls = 'choice' + (fa ? ' persian' : '');
      if (answered) { if (i === c.correctIdx) cls += ' correct'; else if (i === ss.selected) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-a="pick" data-v="${i}" ${answered ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('');
    const fb = answered ? `<div class="feedback-box"><div class="${ss.quality === 'perfect' ? 'ok' : 'bad'}">${ss.quality === 'perfect' ? 'Richtig!' : 'Leider falsch'}</div>
        <div class="full ${fa ? 'fa persian' : ''}">${esc(c.full)}</div>${c.tr ? `<div class="translit" style="margin-top:4px">${esc(c.tr)}</div>` : ''}</div>${this.nextBtn()}` : '';
    return `<div class="langbadge">Welches Wort fehlt?</div>
      <div class="flip-face fadein" style="min-height:120px;padding:22px 14px"><div class="sentence ${fa ? 'fa persian' : ''}">${toks}</div></div>
      <div class="hintline ${c.hintIsFa ? 'persian' : ''}" dir="auto" style="margin-top:12px">${esc(c.hint)}</div>
      <div>${opts}</div>${fb}`;
  },

  /* ----- Satzbildung ----- */
  v_build(step, ss) {
    const b = ss.b, fa = b.answerIsFa;
    const placed = ss.placed.map(i => `<button class="wtok ${fa ? 'fa persian' : ''}" data-a="unplace" data-v="${i}">${esc(b.tokens[i].t)}</button>`).join('');
    const bank = b.tokens.map((tk, i) => `<button class="wtok ${fa ? 'fa persian' : ''} ${ss.placed.includes(i) ? 'used' : ''}" data-a="place" data-v="${i}">${esc(tk.t)}</button>`).join('');
    const full = ss.placed.length === b.tokens.length;
    const fb = ss.result ? `<div class="feedback-box"><div class="${ss.result === 'right' ? 'ok' : 'bad'}">${ss.result === 'right' ? 'Richtig!' : 'Leider falsch'}</div>
        <div class="full ${fa ? 'fa persian' : ''}">${esc(b.full)}</div><div class="translit" style="margin-top:4px">${esc(b.tr)}</div></div>${this.nextBtn()}`
      : `<div class="row" style="margin-top:14px;gap:10px"><button class="pillbtn secondary" style="flex:1" data-a="buildReset">Zurücksetzen</button><button class="pillbtn" style="flex:2" data-a="buildCheck" ${full ? '' : 'disabled'}>Prüfen</button></div>`;
    return `<div class="langbadge">Bilde den Satz</div>
      <div class="flip-face fadein" style="min-height:90px;padding:18px 14px"><div class="term-big ${b.promptIsFa ? 'fa persian' : ''}" style="font-size:${b.promptIsFa ? 28 : 22}px" dir="auto">${esc(b.prompt)}</div></div>
      <div class="tray answer ${fa ? 'rtl' : ''} ${ss.result === 'right' ? 'right' : ss.result === 'wrong' ? 'wrong' : ''}" style="margin-top:14px">${placed || '<span class="muted small">Tippe die Wörter in der richtigen Reihenfolge an</span>'}</div>
      <div class="tray" style="margin-top:12px;${fa ? 'direction:rtl' : ''}">${bank}</div>${fb}`;
  },

  /* ----- Übersetzen ----- */
  v_translate(step, ss) {
    const t = ss.t, fa = t.answerIsFa;
    return `<div class="langbadge">Übersetze den Satz</div>
      <div class="flip-face fadein" style="min-height:90px;padding:18px 14px"><div class="term-big ${t.promptIsFa ? 'fa persian' : ''}" style="font-size:${t.promptIsFa ? 28 : 22}px" dir="auto">${esc(t.prompt)}</div></div>
      <div style="margin-top:16px">${this.inputHTML(ss, fa)}</div>
      ${this.feedbackHTML(ss, { answer: t.solutions[0], answerFa: fa, tr: ss.quality ? t.tr : '' })}`;
  },

  /* ----- Grammatik ----- */
  v_grammar(step, ss) {
    const q = ss.q, answered = ss.selected != null;
    const opts = q.options.map((o, i) => {
      let cls = 'choice ' + (isFaText(o) ? 'pfont' : '');
      if (answered) { if (i === q.correctIdx) cls += ' correct'; else if (i === ss.selected) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" dir="auto" style="font-size:${isFaText(o) ? 21 : 17}px" data-a="pick" data-v="${i}" ${answered ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('');
    const fb = answered ? `<div class="feedback-box"><div class="${ss.quality === 'perfect' ? 'ok' : 'bad'}">${ss.quality === 'perfect' ? 'Richtig!' : 'Leider falsch'}</div>
        <div class="ex" dir="auto">${esc(q.e)}</div>${q.x ? `<div class="ex persian" style="text-align:right;font-size:16px" dir="rtl">${esc(q.x)}</div>` : ''}</div>${this.nextBtn()}` : '';
    return `<div class="langbadge">${esc(q.lang === 'fa' ? 'Persisch' : 'Deutsch')} · ${esc(q.topic)}</div>
      <div class="flip-face fadein" style="min-height:96px;padding:20px 16px"><div class="qtext" dir="auto" style="padding:0;${isFaText(q.q) ? 'font-size:22px' : ''}">${esc(q.q)}</div></div>
      <div style="margin-top:16px">${opts}</div>${fb}`;
  },

  /* ----- Aussprache ----- */
  v_speak(step, ss) {
    const card = cardById(step.cardId);
    const hasRef = card.audio || Speech.can('fa') || Speech.can('de');
    return `<div class="langbadge">Hören · Nachsprechen · Vergleichen</div>
      <div class="flip-face fadein"><div class="term-big fa persian">${esc(card.fa[0])}</div>
        ${card.translit ? `<div class="translit">${esc(card.translit)}</div>` : ''}<div class="muted">${esc(card.de[0])}</div></div>
      <div class="row" style="justify-content:center;gap:18px;margin-top:10px">
        ${hasRef ? `<div style="text-align:center"><button class="iconbtn" style="width:56px;height:56px;font-size:24px" data-a="speakRef" aria-label="Vorbild anhören">▶</button><div class="muted small" style="margin-top:4px">Vorbild</div></div>` : ''}
        <div style="text-align:center"><button class="speakbtn ${ss.recording ? 'rec' : ''}" style="margin:0" data-a="recToggle" aria-label="Aufnahme">${ss.recording ? '⏹' : '●'}</button><div class="muted small" style="margin-top:4px">${ss.recording ? 'Aufnahme läuft …' : 'Aufnehmen'}</div></div>
        ${ss.userBlob ? `<div style="text-align:center"><button class="iconbtn" style="width:56px;height:56px;font-size:24px" data-a="playMine" aria-label="Meine Aufnahme">▶</button><div class="muted small" style="margin-top:4px">Meine</div></div>` : ''}

      <div class="pill-note">Du vergleichst selbst – ZARA bewertet die Aussprache nicht automatisch.</div>`;
  },

  /* ----- Abschluss ----- */
  summary() {
    const s = this.s, st = computeStats();
    const rate = s.answered ? Math.round(s.correct / s.answered * 100) : 0;
    const lvUp = st.level.level > levelInfo(s.xp0).level;
    const newAch = ACHIEVEMENTS.filter(a => a.test(st) && !s.ach0.has(a.id));
    return `<div class="rec-wrap fadein" style="text-align:center;padding-top:40px">
      <div class="big-n">✓</div>
      <div style="font-size:22px;font-weight:700">${esc(s.title)} abgeschlossen</div>
      <div class="sumgrid">
        <div class="card"><div class="v">${s.answered}</div><div class="l">Antworten</div></div>
        <div class="card"><div class="v">${rate}%</div><div class="l">richtig</div></div>
        <div class="card"><div class="v">+${s.xp}</div><div class="l">XP</div></div>
      </div>
      ${lvUp ? `<div class="banner" style="justify-content:center"><b>Level ${st.level.level} erreicht!</b></div>` : ''}
      ${s.weakFixed ? `<div class="muted" style="margin-bottom:8px">${s.weakFixed} schwierige${s.weakFixed === 1 ? 's Wort' : ' Wörter'} richtig beantwortet – stark!</div>` : ''}
      ${newAch.map(a => `<div class="banner" style="justify-content:center">${a.icon} Neuer Meilenstein: <b>${esc(a.name)}</b></div>`).join('')}
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
        ${s.again ? `<button class="pillbtn" data-a="sAgain">Noch eine Runde</button>` : ''}
        <button class="pillbtn ${s.again ? 'secondary' : ''}" data-a="go" data-v="${App.tab}">Fertig</button>
      </div></div>`;
  }
};

/* ---------- Karten-Editor ---------- */
let Editor = null;

A.openEditor = id => {
  const c = id ? cardById(id) : null;
  Editor = { id: id || null,
    de: (c && c.de.length ? c.de.slice() : ['']), fa: (c && c.fa.length ? c.fa.slice() : ['']),
    translit: c ? c.translit : '', tags: c ? c.tags.slice() : [], audio: c ? !!c.audio : false,
    active: c ? c.active : true, fav: c ? c.fav : false, exDe: c ? c.exDe : '', exFa: c ? c.exFa : '',
    newTag: '', _pendingAudio: null, _dupAck: false };
  renderEditor();
};
function renderEditor() {
  const E = Editor, root = $('modalRoot');
  const termFields = (arr, fa, key) => arr.map((v, i) => `<div class="row" style="gap:6px;margin-bottom:6px">
     <input class="field ${fa ? 'persian' : ''}" style="margin:0" ${fa ? 'lang="fa" dir="rtl" autocapitalize="none" autocorrect="off"' : ''} placeholder="${fa ? 'واژه' : 'Begriff'}" value="${esc(v)}" data-i="edTerm" data-k="${key}" data-idx="${i}">
     ${arr.length > 1 ? `<button class="iconbtn" style="background:var(--surface-2);color:var(--text-2)" data-a="edRemoveTerm" data-v="${key}:${i}" aria-label="Entfernen">−</button>` : ''}</div>`).join('')
    + `<button class="chip" data-a="edAddTerm" data-v="${key}">＋ Begriff hinzufügen</button>`;
  const sugg = allTags().filter(t => !E.tags.includes(t)).filter(t => !E.newTag || t.toLowerCase().includes(E.newTag.toLowerCase()));
  root.innerHTML = `<div class="modal"><div class="screen">
    <div class="row editor-head"><button class="chip" data-a="closeEditor">Abbrechen</button>
      <b>${E.id ? 'Karte bearbeiten' : 'Neue Karte'}</b>
      <button class="chip on" data-a="saveEditor">Speichern</button></div>
    <label class="lbl">Deutsch</label>${termFields(E.de, false, 'de')}
    <label class="lbl">Persisch</label>${termFields(E.fa, true, 'fa')}
    <label class="lbl">Lautschrift (nur Hilfe)</label>
    <input class="field" placeholder="z. B. khâne" value="${esc(E.translit)}" autocapitalize="none" autocorrect="off" data-i="edTranslit">
    <label class="lbl">Tags</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">${E.tags.map(t => `<button class="chip on" data-a="edRemoveTag" data-v="${esc(t)}">${esc(t)} <span class="x">✕</span></button>`).join('')}</div>
    <div class="row" style="gap:6px"><input class="field" style="margin:0" placeholder="Tag hinzufügen" value="${esc(E.newTag)}" data-i="edNewTag" data-enter="edAddTag" data-v=""><button class="iconbtn" data-a="edAddTag" data-v="" aria-label="Tag hinzufügen">＋</button></div>
    ${sugg.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${sugg.map(t => `<button class="chip" data-a="edAddTag" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
    <label class="lbl">Beispielsatz (optional)</label>
    <div class="exwrap"><div class="muted small">Für Lückentexte aus deinen eigenen Wörtern – das persische Wort muss im Satz vorkommen.</div>
      <input class="field persian" style="margin-bottom:6px" lang="fa" dir="rtl" autocapitalize="none" autocorrect="off" placeholder="جملهٔ نمونه" value="${esc(E.exFa)}" data-i="edExFa">
      <input class="field" style="margin:0" placeholder="Deutsche Übersetzung" value="${esc(E.exDe)}" data-i="edExDe"></div>
    <label class="lbl">Audio (Persisch)</label>
    <div id="audioArea">${audioAreaHTML()}</div>
    <label class="lbl">Status</label>
    <div class="card row"><span>Aktiv</span><button class="toggle ${E.active ? 'on' : ''}" data-a="edToggle" data-v="active" aria-label="Aktiv"><span></span></button></div>
    <div class="card row"><span>Favorit</span><button class="toggle ${E.fav ? 'on' : ''}" data-a="edToggle" data-v="fav" aria-label="Favorit"><span></span></button></div>
    ${E.id ? `<button class="btn-danger" style="margin-top:20px" data-a="askDeleteCard">Karte löschen</button>` : ''}
    <div style="height:30px"></div>
  </div></div>`;
}
function audioAreaHTML() {
  const E = Editor;
  if (Recorder.active()) return `<button class="pillbtn" style="background:var(--terra)" data-a="stopRec">⏹ Aufnahme stoppen…</button>`;
  let s = `<div class="row" style="gap:8px"><button class="pillbtn secondary" style="flex:1" data-a="startRec">${E.audio ? '● Neu aufnehmen' : '● Aufnehmen'}</button>`;
  if (E.audio) s += `<button class="iconbtn" style="background:var(--surface-2)" data-a="playEditorAudio" aria-label="Abspielen">▶</button><button class="iconbtn" style="background:var(--surface-2);color:var(--terra)" data-a="deleteEditorAudio" aria-label="Aufnahme löschen">🗑</button>`;
  return s + '</div>';
}
IN.edTerm = (v, el) => { Editor[el.dataset.k][Number(el.dataset.idx)] = v; };
IN.edTranslit = v => { Editor.translit = v; };
IN.edNewTag = v => { Editor.newTag = v; };
IN.edExFa = v => { Editor.exFa = v; };
IN.edExDe = v => { Editor.exDe = v; };
A.edAddTerm = k => { Editor[k].push(''); renderEditor(); };
A.edRemoveTerm = v => { const [k, i] = v.split(':'); Editor[k].splice(Number(i), 1); renderEditor(); };
A.edAddTag = (t, el) => {
  const name = ((t && t.length) ? t : Editor.newTag).trim();
  if (!name) return;
  if (!Editor.tags.some(x => x.toLowerCase() === name.toLowerCase())) Editor.tags.push(name);
  Editor.newTag = ''; renderEditor();
};
A.edRemoveTag = t => { Editor.tags = Editor.tags.filter(x => x !== t); renderEditor(); };
A.edToggle = k => { Editor[k] = !Editor[k]; renderEditor(); };
A.closeEditor = () => { if (Recorder.active()) Recorder.abort(); $('modalRoot').innerHTML = ''; Editor = null; };

A.startRec = async () => {
  if (!Recorder.supported()) { toast('Aufnahme wird in dieser Umgebung nicht unterstützt.', 3000); return; }
  try { await Recorder.start(); renderEditor(); }
  catch (e) { toast(Recorder.errorMessage(e), 3500); }
};
A.stopRec = async () => {
  const blob = await Recorder.stop();
  if (blob) { Editor._pendingAudio = blob; Editor.audio = true; }
  renderEditor();
};
A.playEditorAudio = async () => {
  let blob = Editor._pendingAudio;
  if (!blob && Editor.id) blob = await AudioStore.get(Editor.id);
  if (!(await Player.playBlob(blob))) toast('Keine Aufnahme');
};
A.deleteEditorAudio = () => { Editor.audio = false; Editor._pendingAudio = null; Editor._audioRemoved = true; renderEditor(); };

function showDupDialog(dup) {
  openDialog(`<div class="dlg-ic">⚠︎</div><h3>Wort schon vorhanden</h3>
    <p>Eine Karte mit <span class="dup-word">${esc(dup.de.join(', '))}</span>${dup.fa.length ? ` / <span class="dup-word persian">${esc(dup.fa.join('، '))}</span>` : ''} existiert bereits. Du kannst sie bearbeiten oder die neue Karte trotzdem anlegen.</p>
    <div class="dlg-actions"><button class="pillbtn secondary" data-a="dupEdit" data-v="${esc(dup.id)}">Karte bearbeiten</button>
    <button class="pillbtn" data-a="dupProceed">Trotzdem anlegen</button></div>`);
}
A.dupProceed = () => { if (Editor) Editor._dupAck = true; closeDialog(); return A.saveEditor(); };
A.dupEdit = id => { closeDialog(); A.closeEditor(); A.openEditor(id); };

A.saveEditor = async () => {
  const E = Editor; if (!E) return;
  const de = E.de.map(s => s.trim()).filter(Boolean), fa = E.fa.map(s => s.trim()).filter(Boolean);
  if (!de.length || !fa.length) { toast('Je Seite mind. ein Begriff'); return; }
  if (!E.id && !E._dupAck) {
    const dset = new Set(de.map(x => x.toLowerCase())), fset = new Set(fa.map(x => Answer.normalize(x, true)));
    const dup = DB.data.cards.find(c => c.de.some(x => dset.has(x.toLowerCase())) || c.fa.some(x => fset.has(Answer.normalize(x, true))));
    if (dup) { showDupDialog(dup); return; }
  }
  let card = E.id ? cardById(E.id) : null;
  if (!card) {
    card = Schema.fixCard({ id: uid(), de, fa, createdAt: now(), updatedAt: now() }, []);
    DB.data.cards.push(card);
  }
  card.de = de; card.fa = fa; card.translit = E.translit.trim(); card.tags = E.tags.slice();
  card.active = E.active; card.fav = E.fav; card.audio = E.audio; card.exDe = E.exDe.trim(); card.exFa = E.exFa.trim();
  card.updatedAt = now();
  if (E._pendingAudio) await AudioStore.put(card.id, E._pendingAudio);
  if (E._audioRemoved && !E.audio && E.id) DB.markOrphan(card.id);
  if (!DB.save()) toast('Speichern fehlgeschlagen – bitte Backup sichern', 4000);
  else toast('Gespeichert');
  A.closeEditor(); render();
};
A.askDeleteCard = () => {
  const E = Editor; if (!E || !E.id) return;
  const card = cardById(E.id); if (!card) return;
  confirmDialog({ icon: '🗑', iconColor: 'var(--terra)', title: 'Karte löschen?', danger: true, ok: 'Löschen',
    body: `„<span class="dup-word">${esc(card.de.join(', '))}</span>${card.fa.length ? ` / <span class="dup-word persian">${esc(card.fa.join('، '))}</span>` : ''}" wird gelöscht. Vorher wird automatisch eine Sicherungskopie angelegt.`,
    onOk: async () => {
      await DB.snapshot('pre-delete', 10 * 60 * 1000);
      const idx = DB.data.cards.findIndex(c => c.id === E.id);
      if (idx >= 0) { const c = DB.data.cards[idx]; if (c.audio) DB.markOrphan(c.id); DB.data.cards.splice(idx, 1); DB.save(); }
      A.closeEditor(); render(); toast('Karte gelöscht');
    } });
};

/* ---------- Backup sichern ---------- */
function markBackupDone() { DB.data.meta.lastExternalBackup = now(); DB.save(); }

A.openBackup = () => {
  const count = DB.data.cards.length, audioN = DB.data.cards.filter(c => c.audio).length;
  const sizeKB = Math.max(1, Math.round(JSON.stringify(DB.data).length / 1024));
  openDialog(`<div class="dlg-ic" style="color:var(--sage)">💾</div><h3>Backup sichern</h3>
    <p><b>${count}</b> Karten · ${sizeKB} KB${audioN ? ` · ${audioN} Aufnahmen` : ''}. So gehen deine Wörter und dein Fortschritt nie verloren.</p>
    <div class="dlg-actions">
      <button class="pillbtn" data-a="shareBackup">⤴ Als Datei sichern${audioN ? ' (mit Aufnahmen)' : ''}</button>
      <button class="pillbtn secondary" data-a="copyBackup">⧉ Als Text kopieren${audioN ? ' (ohne Aufnahmen)' : ''}</button>
      <button class="pillbtn secondary" data-a="toggleBackupText">Text anzeigen</button>
    </div>
    <textarea id="backupText" readonly class="field hidden" style="height:110px;font-family:monospace;font-size:11px;margin:12px 0 0" data-a="selectAll"></textarea>
    <div class="hint" style="margin-top:10px">„Datei sichern" öffnet das iOS-Menü → <b>In Dateien sichern</b> (legt eine <code>.json</code> an) oder an dich selbst per Mail/Notiz senden. Zurückholen über „Backup wiederherstellen".</div>`, true);
};
A.selectAll = (v, el) => { try { el.select(); } catch (e) {} };
A.toggleBackupText = async () => {
  const ta = $('backupText'); if (!ta) return;
  ta.classList.toggle('hidden');
  if (!ta.classList.contains('hidden')) {
    if (!ta.value) ta.value = (await Backup.build({ includeAudio: false })).json;
    ta.focus(); try { ta.select(); } catch (e) {}
  }
};
A.shareBackup = async () => {
  const { json } = await Backup.build({ includeAudio: true });
  const name = Backup.fileName();
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'ZARA Backup' });
      markBackupDone(); toast('Backup gesichert ✓'); closeDialog(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    if (navigator.share) { await navigator.share({ title: 'ZARA Backup', text: (await Backup.build()).json }); markBackupDone(); closeDialog(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  let embedded = true; try { embedded = window.self !== window.top; } catch (_) {}
  if (!embedded) {
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      markBackupDone(); toast('Gespeichert als ' + name); return;
    } catch (e) {}
  }
  await A.copyBackup();
};
A.copyBackup = async () => {
  const json = (await Backup.build({ includeAudio: false })).json;
  try { await navigator.clipboard.writeText(json); markBackupDone(); toast('In Zwischenablage kopiert ✓'); }
  catch (e) {
    const ta = $('backupText');
    if (ta) { ta.value = json; ta.classList.remove('hidden'); ta.focus(); try { ta.select(); ta.setSelectionRange(0, ta.value.length); } catch (_) {} }
    toast('Text ist markiert – jetzt „Kopieren" antippen', 3500);
  }
};

/* ---------- Wiederherstellen ---------- */
const Restore = { pending: null, source: '' };

A.openRestore = () => {
  openDialog(`<div class="dlg-ic">⟲</div><h3>Backup wiederherstellen</h3>
    <p>Füge deinen kopierten Backup-Text ein oder wähle die Backup-Datei. Vor jeder Wiederherstellung sichert ZARA den aktuellen Stand automatisch.</p>
    <textarea id="restoreText" class="field" style="height:120px;font-family:monospace;font-size:11px;margin:0 0 4px" placeholder="Backup-Text hier einfügen…"></textarea>
    <div class="dlg-actions"><button class="pillbtn" data-a="restoreFromText">Prüfen</button>
    <button class="pillbtn secondary" data-a="pickFile">Datei wählen</button></div>`, true);
};
A.pickFile = () => { closeDialog(); const f = $('importFile') || document.querySelector('#importFile'); if (f) f.click(); else { A.sub('more'); } };
A.restoreFromText = () => {
  const ta = $('restoreText'); const txt = ta ? ta.value.trim() : '';
  if (!txt) { toast('Kein Text eingefügt'); return; }
  showRestorePreview(Backup.parse(txt), 'Einfügen');

document.addEventListener('change', e => {
  const el = e.target.closest('[data-c="importFile"]');
  if (!el) return;
  const f = el.files && el.files[0]; if (!f) return;
  f.text().then(t => { showRestorePreview(Backup.parse(t), f.name); }).catch(() => toast('Datei konnte nicht gelesen werden.'));
  el.value = '';
});

function showRestorePreview(parsed, source) {
  if (!parsed.ok) { openDialog(`<div class="dlg-ic" style="color:var(--terra)">✕</div><h3>Backup nicht verwendbar</h3><p>${esc(parsed.error)}</p>
    <div class="dlg-actions"><button class="pillbtn secondary" data-a="closeDialog">OK</button></div>`); return; }
  Restore.pending = parsed; Restore.source = source;
  const sm = parsed.summary, recovery = Store.mode === 'recovery';
  const cur = recovery ? 0 : DB.data.cards.length;
  openDialog(`<div class="dlg-ic" style="color:var(--sage)">⟲</div><h3>Backup gefunden</h3>
    <p><b>${sm.cards}</b> Karten · ${sm.logs} Verlaufseinträge · ${sm.tags} Tags${sm.audio ? ' · ' + sm.audio + ' Aufnahmen' : ''}
    ${parsed.createdAt ? '<br>Erstellt: ' + esc(fmtDate(parsed.createdAt)) : ''}
    ${parsed.migratedFrom ? '<br>Älteres Format – wird automatisch aktualisiert.' : ''}
    ${parsed.checksumOk === false ? '<br><b style="color:var(--terra)">Achtung: Prüfsumme stimmt nicht – die Datei wurde verändert oder ist beschädigt.</b>' : ''}
    ${parsed.issues.length ? '<br>' + parsed.issues.length + ' kleine Unstimmigkeiten werden repariert.' : ''}
    ${recovery ? '' : `<br><br>Aktuell auf diesem Gerät: <b>${cur}</b> Karten.`}</p>
    <div class="dlg-actions">
      <button class="pillbtn" data-a="applyRestore" data-v="replace">${recovery ? 'Wiederherstellen' : 'Ersetzen (aktuellen Stand vorher sichern)'}</button>
      ${recovery ? '' : '<button class="pillbtn secondary" data-a="applyRestore" data-v="merge">Zusammenführen (nichts geht verloren)</button>'}
      <button class="pillbtn secondary" data-a="closeDialog">Abbrechen</button></div>`, true);
}
A.applyRestore = async mode => {
  const parsed = Restore.pending; if (!parsed) return;
  closeDialog();
  const res = await Backup.apply(parsed, mode);
  Restore.pending = null;
  if (!res.ok) { openDialog(`<div class="dlg-ic" style="color:var(--terra)">✕</div><h3>Nicht wiederhergestellt</h3><p>${esc(res.error)}</p><div class="dlg-actions"><button class="pillbtn secondary" data-a="closeDialog">OK</button></div>`); return; }
  applyTheme();
  App.tab = 'cards'; App.sub = null; App.session = false; render();
  openDialog(`<div class="dlg-ic" style="color:var(--sage)">✓</div><h3>Wiederhergestellt</h3>
    <p>${res.cards} Karten sind jetzt in ZARA.${res.added != null ? ` (${res.added} neu hinzugefügt, ${res.updated} aktualisiert)` : ''}${res.audioRestored ? ` ${res.audioRestored} Aufnahmen übernommen.` : ''}</p>
    <div class="dlg-actions">${res.undoId ? '<button class="pillbtn secondary" data-a="undoRestore">Rückgängig machen</button>' : ''}<button class="pillbtn" data-a="closeDialog">OK</button></div>`);
};
A.undoRestore = async () => {
  closeDialog();
  const res = await Backup.undo();
  if (res.ok) { applyTheme(); render(); toast('Rückgängig gemacht ✓'); } else toast(res.error || 'Nicht möglich', 3500);
};

/* ---------- Automatische Sicherungen ---------- */
const SNAP_LABEL = { auto: 'Automatisch (täglich)', 'pre-migration': 'Vor Update', 'pre-restore': 'Vor Wiederherstellung', 'pre-delete': 'Vor Löschen' };
A.openSnapshots = async () => {
  const list = await DB.listSnapshots();
  openDialog(`<div class="dlg-ic" style="color:var(--sage)">◷</div><h3>Automatische Sicherungen</h3>
    <p>ZARA sichert deinen Stand täglich und vor Updates, Löschen und Wiederherstellungen – nur auf diesem Gerät. Ein Backup in „Dateien" schützt zusätzlich.</p>
    ${list.length ? list.map(s => `<div class="snaprow"><div><b>${esc(fmtDate(s.at))}</b><br><span class="muted small">${esc(SNAP_LABEL[s.reason] || s.reason)} · ${s.cards} Karten</span></div><button data-a="snapLoad" data-v="${esc(s.id)}">Laden</button></div>`).join('') : '<div class="muted small">Noch keine Sicherungen vorhanden.</div>'}
    <div class="dlg-actions"><button class="pillbtn secondary" data-a="closeDialog">Schließen</button></div>`, true);
};
A.snapLoad = async id => {
  const snap = await DB.getSnapshot(id);
  if (!snap) { toast('Sicherung nicht gefunden'); return; }
  showRestorePreview(Backup.parse(snap.json), 'Sicherung');
};

/* ---------- Wiederherstellungs-Bildschirm (Daten nicht automatisch geladen) ---------- */
function renderRecovery() {
  $('tabbar').innerHTML = '';
  const r = Store.recovery || {};
  const msgs = {
    corrupt: 'Die gespeicherten Daten konnten nicht gelesen werden. <b>Es wurde nichts gelöscht oder überschrieben</b> – eine Kopie liegt sicher auf diesem Gerät.',
    tooNew: 'Diese Daten wurden mit einer neueren Version von ZARA gespeichert. Bitte die App ganz schließen und neu öffnen, damit die neueste Version geladen wird. Deine Daten bleiben unverändert.',
    missing: 'Auf diesem Gerät wurden keine ZARA-Daten gefunden, es gibt aber automatische Sicherungen.'
  };
  $('screen').className = 'screen';
  $('screen').innerHTML = `<div class="rec-wrap" style="text-align:center">
    <span style="width:64px;height:64px;display:inline-block">${CAT_SVG}</span>
    <h2>Deine Daten brauchen Aufmerksamkeit</h2>
    <p class="muted" style="font-size:14px;line-height:1.5">${msgs[r.reason] || msgs.corrupt}</p>
    ${r.reason === 'tooNew' ? '' : `
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
      <button class="pillbtn" data-a="openSnapshots">Aus automatischer Sicherung wiederherstellen</button>
      <button class="pillbtn secondary" data-a="openRestore">Backup einfügen oder Datei wählen</button>
      ${r.reason === 'corrupt' ? '<button class="pillbtn secondary" data-a="copyQuarantine">Beschädigten Text kopieren</button>' : ''}
      <button class="pillbtn secondary" style="color:var(--terra)" data-a="startFresh">Neu beginnen</button>
    </div>`}
  </div><input type="file" id="importFile" accept="application/json,.json,text/plain" class="hidden" data-c="importFile">`;
}
A.copyQuarantine = async () => {
  const k = Store.recovery && Store.recovery.quarantineKey;
  const raw = k ? Store._get(k) : null;
  if (!raw) { toast('Nichts zu kopieren'); return; }
  try { await navigator.clipboard.writeText(raw); toast('Kopiert ✓'); } catch (e) { toast('Kopieren nicht möglich', 3000); }
};
A.startFresh = () => {
  confirmDialog({ title: 'Wirklich neu beginnen?', danger: true, ok: 'Neu beginnen',
    body: 'ZARA startet leer. Der beschädigte Text bleibt als Kopie auf dem Gerät erhalten, und du kannst später jederzeit ein Backup einspielen.',
    onOk: () => { Backup.startFresh(); applyTheme(); App.tab = 'today'; render(); } });
};

/* ===== 99-main.js ===== */
/* ============================================================
   99-main: Start. Robust – bei jedem Fehler erscheint eine
   verständliche Meldung mit Daten-Rettung statt eines leeren Bildschirms.
   ============================================================ */

/** Demo-Karten NUR bei echter Neuinstallation (nie über vorhandene Daten). */
function seedIfEmpty() {
  if (DB.data.cards.length) return;
  const s = [
    [['Haus', 'Gebäude'], ['خانه', 'منزل'], 'khâne', ['Alltag']],
    [['Mutter'], ['مادر'], 'mâdar', ['Familie']],
    [['Vater'], ['پدر'], 'pedar', ['Familie']],
    [['Wasser'], ['آب'], 'âb', ['Alltag']],
    [['gehen'], ['رفتن'], 'raftan', ['Verben']],
    [['essen'], ['خوردن'], 'khordan', ['Verben']],
    [['Brot'], ['نان'], 'nân', ['Alltag']],
    [['Freund'], ['دوست'], 'dust', ['Familie', 'Alltag']]
  ];
  s.forEach(([de, fa, tr, tags]) => DB.data.cards.push(Schema.fixCard({ id: uid(), de, fa, translit: tr, tags, createdAt: now(), updatedAt: now() }, [])));
}

function showFatal(err) {
  let raw = ''; try { raw = localStorage.getItem(Store.KEY) || ''; } catch (_) {}
  const s = $('screen'); if (!s) return;
  s.className = 'screen';
  s.innerHTML = `<div class="rec-wrap" style="text-align:center">
    <div style="font-size:42px">⚠️</div>
    <h2>ZARA konnte nicht starten</h2>
    <p class="muted" style="font-size:14px">Bitte die App ganz schließen und neu öffnen. Deine Daten wurden nicht verändert. Zur Sicherheit kannst du sie vorher kopieren:</p>
    ${raw ? `<button class="pillbtn" style="margin-top:14px" data-a="rescueCopy">⧉ Meine Daten als Backup kopieren</button>
    <textarea id="rawBak" readonly class="field hidden" style="height:120px;font-family:monospace;font-size:11px;margin-top:10px">${esc(raw)}</textarea>` : '<p class="muted small">Keine gespeicherten Daten gefunden.</p>'}
    <p class="muted small" style="margin-top:14px;word-break:break-all">${esc((err && (err.message || String(err))) || 'Unbekannter Fehler')}</p></div>`;
}
A.rescueCopy = async () => {
  let raw = ''; try { raw = localStorage.getItem(Store.KEY) || ''; } catch (_) {}
  try { await navigator.clipboard.writeText(raw); toast('Kopiert ✓ – bitte in eine Notiz einfügen', 3500); }
  catch (e) { const t = $('rawBak'); if (t) { t.classList.remove('hidden'); t.focus(); try { t.select(); } catch (_) {} } }
};

function watchColorScheme() {
  try {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const cb = () => { if (DB.data.settings.appearance === 'system') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', cb); else if (mq.addListener) mq.addListener(cb);
  } catch (e) {}
}

const withTimeout = (p, ms, fallback) => Promise.race([p, new Promise(res => setTimeout(() => res(fallback), ms))]);

async function boot() {
  try {
    let ls = null;
    try { ls = window.localStorage; ls.getItem('x'); } catch (e) { throw new Error('Der Speicher dieses Browsers ist nicht verfügbar.'); }
    Store.attach(ls);
    Store.onSaveError = () => { toast('Speichern fehlgeschlagen – bitte Backup sichern', 4000); };
    Speech.init();
    const info = Store.load();
    applyTheme(); watchColorScheme();

    if (Store.mode === 'recovery') { renderRecovery(); return; }

    if (info.fresh) {
      // Keine Daten gefunden: gibt es Sicherungen? Dann NICHT stillschweigend neu anfangen.
      const snaps = await withTimeout(DB.listSnapshots(), 1500, []);
      if (snaps.some(s => s.cards > 0)) {
        Store.mode = 'recovery'; Store.recovery = { reason: 'missing' };
        renderRecovery(); return;
      }
      seedIfEmpty();
      if (!Store.save()) toast('Speichern nicht möglich – Speicher des Browsers voll?', 4000);
    } else {
      if (info.preMigration && info.originalRaw) await DB.snapshot('pre-migration', 0, info.originalRaw);
      if (info.needsSave && !Store.save()) throw new Error('Die aktualisierten Daten konnten nicht gespeichert werden. Der alte Stand bleibt erhalten.');
    }
    Store.rotatePrev();
    if (Store.compactLogs()) Store.save();
    render();
    // Im Hintergrund: tägliche Sicherung, Aufräumen, dauerhaften Speicher anfragen.
    DB.autoSnapshot().then(() => DB.purgeOrphans()).then(() => DB.requestPersistence()).then(() => DB.save()).catch(() => {});
  } catch (e) { try { showFatal(e); } catch (_) {} }
}
boot();

</script>
